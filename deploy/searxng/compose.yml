services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: minidora-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: "${MINIDORA_SEARXNG_SECRET:-minidora-local-only-change-before-public}"
      SEARXNG_BASE_URL: "http://127.0.0.1:8888/"
      SEARXNG_LIMITER: "false"
