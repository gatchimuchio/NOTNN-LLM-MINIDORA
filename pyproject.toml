[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidora-notnn"
version = "0.5.0"
description = "日本語基底の非ニューラルネットワークLLM研究実装"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "がっちむち♂" },
]
license = { file = "LICENSE-APACHE-2.0" }
keywords = [
  "LLM",
  "non-neural",
  "NOTNN",
  "MINIDORA",
  "constitutive-specification",
  "Japanese",
  "deterministic-model-core",
  "exact-probability",
  "subject-consistency",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Japanese",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.urls]
Repository = "https://github.com/gatchimuchio/NOTNN-LLM-MINIDORA"
"LLM Constitutive Specification" = "https://github.com/gatchimuchio/LLM-Constitutive-Specification"

[project.scripts]
minidora = "minidora.__main__:main"
minidora-product = "minidora.製品版.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"minidora.製品版" = ["web/*.html", "web/*.css", "web/*.js"]
