<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d12" />
  <title>MINIDORA</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="minidora-page">
  <div class="product-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark">M</div>
        <div>
          <div class="brand-name">MINIDORA</div>
          <div class="brand-version">Product Prototype</div>
        </div>
      </div>

      <button id="newChat" class="new-chat-button" type="button">
        <span class="new-chat-plus">＋</span>
        <span>新しい会話</span>
      </button>

      <nav class="sidebar-section" aria-label="Capability Modules">
        <div class="sidebar-label">CAPABILITY MODULES</div>
        <div class="capability-row"><span class="cap-dot"></span><span>Search / Reference</span></div>
        <div class="capability-row"><span class="cap-dot"></span><span>Summarization</span></div>
        <div class="capability-row"><span class="cap-dot"></span><span>Calculation</span></div>
        <div class="capability-row"><span class="cap-dot"></span><span>Transformation</span></div>
        <div class="capability-row"><span class="cap-dot"></span><span>Governance Trace</span></div>
      </nav>

      <div class="sidebar-spacer"></div>

      <button id="openComparator" class="compare-launch" type="button">
        <span class="compare-icon">G</span>
        <span>
          <strong>Gemini比較</strong>
          <small>別ウィンドウで開く</small>
        </span>
      </button>

      <div class="sidebar-status">
        <span id="minidoraStatus" class="status-dot pending"></span>
        <div>
          <strong id="minidoraStatusText">接続確認中</strong>
          <small>MINIDORA Backend</small>
        </div>
      </div>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div class="workspace-title">
          <strong>MINIDORA</strong>
          <span>Non-neural LLM</span>
        </div>
        <div class="workspace-actions">
          <label class="compare-sync" title="ONにすると、ユーザー入力だけを別ウィンドウのGeminiにも同時送信します">
            <input id="compareSync" type="checkbox" checked />
            <span class="switch"></span>
            <span>Geminiへ同時送信</span>
          </label>
          <button id="openComparatorTop" class="header-button" type="button">比較窓を開く</button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <section class="composer-zone">
        <form id="composer" class="composer">
          <textarea id="input" rows="1" placeholder="MINIDORAにメッセージを送る" autocomplete="off" autofocus></textarea>
          <button id="send" class="send-button" type="submit">送信</button>
        </form>
        <div class="composer-info">
          <span id="composerState">MINIDORAへ送信</span>
          <span class="privacy-note">Gemini比較ON時も共有するのは入力文だけです。</span>
        </div>
      </section>
    </main>
  </div>

  <div id="traceBackdrop" class="drawer-backdrop hidden" data-close-trace></div>
  <aside id="traceDrawer" class="trace-drawer hidden" aria-label="MINIDORA Governance Trace" aria-hidden="true">
    <header class="drawer-header">
      <div>
        <div class="drawer-kicker">MINIDORA GOVERNANCE</div>
        <h2>Response Trace</h2>
      </div>
      <button id="closeTrace" class="icon-button" type="button" aria-label="Traceを閉じる">×</button>
    </header>
    <div id="traceContent" class="trace-content"></div>
  </aside>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
