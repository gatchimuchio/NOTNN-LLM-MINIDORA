<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d1119" />
  <title>Gemini — Independent Comparator</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="gemini-page">
  <div class="gemini-shell">
    <header class="gemini-header">
      <div class="gemini-brand"><div class="gemini-mark">G</div><div><strong>Gemini</strong><span>Independent Comparator</span></div></div>
      <div class="gemini-header-actions"><span id="geminiStatus" class="gemini-status pending">接続確認中</span><button id="clearGemini" class="header-button" type="button">クリア</button></div>
    </header>
    <div class="independence-notice">MINIDORAとは独立しています。受け取るのは比較用の同じ入力文だけで、MINIDORAの検索Data・Module出力・Sources・Traceにはアクセスしません。</div>
    <main id="geminiMessages" class="gemini-messages" aria-live="polite"></main>
    <section class="gemini-composer-zone">
      <form id="geminiComposer" class="composer gemini-composer">
        <textarea id="geminiInput" rows="1" placeholder="Geminiへ直接メッセージを送る" autocomplete="off" autofocus></textarea>
        <button id="geminiSend" class="send-button gemini-send" type="submit">送信</button>
      </form>
      <div class="gemini-footer-note">MINIDORAから同期された入力も、この窓の独立したGemini経路で処理されます。</div>
    </section>
  </div>
  <script type="module" src="/static/gemini.js"></script>
</body>
</html>
