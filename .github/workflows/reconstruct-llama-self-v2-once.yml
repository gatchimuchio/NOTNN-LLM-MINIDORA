name: reconstruct-llama-self-v2-once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reconstruct-llama-self-v2-once.yml
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct and verify canonical artifact
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp_llama_self/artifact.part*.b64 | base64 -d > /tmp/llama-self-v2.zip
          echo 'e9b674c92c5bf99513569ea36462d76948922adba25a58a10b5c0ce2d3d75de5  /tmp/llama-self-v2.zip' | sha256sum -c -
          rm -rf /tmp/llama-self-v2
          mkdir -p /tmp/llama-self-v2
          unzip -q /tmp/llama-self-v2.zip -d /tmp/llama-self-v2
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          src = Path('/tmp/llama-self-v2/Llama3_自己一貫性_HDS再構文化_v2')
          manifest = json.loads((src / 'MANIFEST.json').read_text(encoding='utf-8'))
          for item in manifest['files']:
              p = src / item['path']
              b = p.read_bytes()
              assert len(b) == item['bytes'], (p, len(b), item['bytes'])
              assert hashlib.sha256(b).hexdigest() == item['sha256'], p
          print('manifest verification: PASS')
          PY
          dest='構文化/Llama3_自己一貫性_HDS再構文化_v2'
          rm -rf "$dest"
          cp -a '/tmp/llama-self-v2/Llama3_自己一貫性_HDS再構文化_v2' "$dest"
      - name: Commit verified canonical artifact and remove transfer files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'minidora-artifact-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- '構文化/Llama3_自己一貫性_HDS再構文化_v2'
          git rm -r -- .tmp_llama_self
          git rm -- .github/workflows/reconstruct-llama-self-v2-once.yml
          git commit -m 'Llama3自己一貫性HDS再構文化v2正本をSHA検証して展開'
          git push origin main
