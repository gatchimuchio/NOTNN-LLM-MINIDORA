name: Restore canonical structure packages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-canonical-packages.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Llama3 package byte-identically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '構文化/正本パッケージ'
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile

          root = Path('構文化/Llama3_HDS日本語構文_v1.0')
          out = Path('構文化/正本パッケージ/Llama3_HDS日本語構文_v1.0.zip')
          expected = '77490354c7cf04beadd3b61d75a48457b8f0141d0145ea77950a5b7929545e02'
          base = 'Llama3_HDS日本語構文_v1.0/'

          rels = sorted(str(p.relative_to(root)).replace('\\','/') for p in root.rglob('*') if p.is_file())
          if len(rels) != 16:
              raise SystemExit(f'Llama3 file count mismatch: {len(rels)}')

          early = {
              'HDS/00_HDS全量構文化報告.md',
              'HDS/01_成立関係群.json',
              'README.md',
              '監査/未解残差.json',
          }
          source_lock = '教師固定/00_source_lock.json'

          with zipfile.ZipFile(out, 'w') as z:
              for rel in rels:
                  if rel == source_lock:
                      dt = (2026,8,20,1,25,12)
                  elif rel in early:
                      dt = (2026,8,20,1,26,44)
                  else:
                      dt = (2026,8,20,1,27,54)
                  zi = zipfile.ZipInfo(base + rel, dt)
                  zi.create_system = 3
                  zi.create_version = 20
                  zi.extract_version = 20
                  zi.flag_bits = 2048
                  zi.volume = 0
                  zi.internal_attr = 0
                  zi.external_attr = 2175008768
                  zi.comment = b''
                  zi.extra = b''
                  zi.compress_type = zipfile.ZIP_DEFLATED
                  z.writestr(zi, (root / rel).read_bytes())

          got = hashlib.sha256(out.read_bytes()).hexdigest()
          print('Llama3 sha256', got)
          if got != expected:
              raise SystemExit(f'Llama3 byte identity mismatch: {got}')
          PY

      - name: Restore K3 full Japanese translation package byte-identically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/k3restore
          mkdir -p /tmp/k3restore
          gh release download 'k3-hds-v6.1-current-9f62e4e' \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'K3_HDS_JA_CURRENT_CANONICAL_BUNDLE_v6_1.zip' \
            --dir /tmp/k3restore

          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          import hashlib, re, zipfile

          src = Path('/tmp/k3restore/K3_HDS_JA_CURRENT_CANONICAL_BUNDLE_v6_1.zip')
          out = Path('構文化/正本パッケージ/K3_HDS日本語翻訳データ_全量_v6_1.zip')
          expected = 'c861a891835d9a11894a4225ca210ca151058cad1e957b71b1ae453dc7f89fef'
          late_shards = {2,3,5,8,9,10,12,15,16,18,19,21,22,23,24,29,34,36,39,42,43,45,46,47,50,51,54,55,56,58,59,60,66,67,69,70,72,73,74,76,77,80,85,87,89,91,92,95}

          translation_readme = '''# K3 HDS 日本語翻訳データ 全量出力 v6.1\n\nこのZIPは、K3のHDS日本語意味構文データを直接閲覧できる形に展開した全量出力。\n\n- v6.0_基底全量/: 固定HF revision c5d1dd4... を含む全量成果。96 weight shardの日本語意味構文、HF非weight、日本語意味構文索引、公式GitHub/Tech Blog意味構文、監査・provenanceを含む。\n- v6.1_現行差分/: HF current revision 9f62e4e... までの追加・変更5 artifactのHDS日本語意味構文と監査。\n- 統合母集合: 130 source items。未処理item=0、未処理byte=0、HDS gap=0。\n\nこの出力は元のv6.0正本を改変せず展開し、v6.1 overlayを追加した閲覧・利用用コピーである。\n'''.encode('utf-8')

          data = {}
          with zipfile.ZipFile(src, 'r') as cur:
              data['00_README_現行統合正本.md'] = cur.read('README.md')
              data['00_統合母集合.json'] = cur.read('bundle-manifest.json')
              data['README_翻訳データ全量.md'] = translation_readme

              base_bytes = cur.read('base/K3_HDS_JA_FULL_PUBLIC_COMPILE_v6_0.zip')
              with zipfile.ZipFile(BytesIO(base_bytes), 'r') as base:
                  for info in base.infolist():
                      if info.is_dir():
                          continue
                      name = 'v6.0_基底全量/' + info.filename
                      data[name] = base.read(info.filename)

              for rel in ['HDS-日本語意味構文.jsonl.gz','README.md','audit.json','current-hf-mother-set.json','delta-manifest.json']:
                  data['v6.1_現行差分/' + rel] = cur.read('overlay/' + rel)

          names = sorted(data)
          if len(names) != 212:
              raise SystemExit(f'K3 file count mismatch: {len(names)}')

          with zipfile.ZipFile(out, 'w') as z:
              for name in names:
                  shard = re.search(r'/shard-(\d+)\.jsonl\.gz$', name)
                  late = (
                      name == 'README_翻訳データ全量.md' or
                      name.endswith('/04_HF母集合.json') or
                      (shard is not None and int(shard.group(1)) in late_shards)
                  )
                  dt = (2026,8,19,20,43,44) if late else (2026,8,19,20,43,42)
                  zi = zipfile.ZipInfo(name, dt)
                  zi.create_system = 3
                  zi.create_version = 20
                  zi.extract_version = 20
                  zi.flag_bits = 2048
                  zi.volume = 0
                  zi.internal_attr = 0
                  zi.external_attr = 2175008768
                  zi.comment = b''
                  zi.extra = b''
                  zi.compress_type = zipfile.ZIP_STORED if name.endswith('.gz') else zipfile.ZIP_DEFLATED
                  z.writestr(zi, data[name])

          got = hashlib.sha256(out.read_bytes()).hexdigest()
          print('K3 sha256', got)
          print('K3 bytes', out.stat().st_size)
          if got != expected:
              raise SystemExit(f'K3 byte identity mismatch: {got}')
          PY

      - name: Refresh package index and validation
        shell: bash
        run: |
          set -euo pipefail
          cat > '構文化/正本パッケージ/README.md' <<'EOF'
          # 構文化正本パッケージ

          このディレクトリには、構文化正本の移送用 ZIP パッケージを保持する。

          - Apertus 1.5
          - LLM360 K2-V2
          - OLMo 3
          - Llama 3
          - K3 HDS日本語翻訳データ 全量 v6.1

          各 ZIP はアップロード原本、または正本ソースから byte-identical に復元した原本を保持する。サイズ・SHA-256・Git blob SHA-1 は `IMPORT_VALIDATION.json` に記録する。
          EOF

          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          root=Path('構文化/正本パッケージ')
          names=[
              'Apertus1_5_HDS日本語構文_v1.0_repo.zip',
              'K2V2_HDS日本語構文_v1.0_repo.zip',
              'OLMo3_HDS日本語構文_v1.0_repo.zip',
              'Llama3_HDS日本語構文_v1.0.zip',
              'K3_HDS日本語翻訳データ_全量_v6_1.zip',
          ]
          packages={}
          for name in names:
              p=root/name
              b=p.read_bytes()
              packages[name]={
                  'bytes':len(b),
                  'sha256':hashlib.sha256(b).hexdigest(),
                  'git_blob_sha1':subprocess.check_output(['git','hash-object',str(p)],text=True).strip(),
              }
          out={
              'validation':'canonical packages verified before restore; Llama3 and K3 restored byte-identically to supplied originals',
              'packages':packages,
          }
          (root/'IMPORT_VALIDATION.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Commit restored packages and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'canonical-package-restore-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            '構文化/正本パッケージ/Llama3_HDS日本語構文_v1.0.zip' \
            '構文化/正本パッケージ/K3_HDS日本語翻訳データ_全量_v6_1.zip' \
            '構文化/正本パッケージ/README.md' \
            '構文化/正本パッケージ/IMPORT_VALIDATION.json'
          git rm -- '.github/workflows/restore-canonical-packages.yml'
          git commit -m '構文化正本パッケージ: Llama3・K3全量を復元'
          git push origin HEAD:main
