name: K3 HDS Fast Range Benchmark

on:
  push:
    branches:
      - chappie/k3-hds-stream-v6
    paths:
      - tools/k3_hds_stream_compile_fast.py
      - .github/workflows/k3-hds-fast-benchmark.yml

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/k3-hds-stream-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy requests
      - name: Full shard 1 fast compile
        run: |
          mkdir -p out
          start=$(date +%s)
          python tools/k3_hds_stream_compile_fast.py \
            --shard 1 --fetch-workers 8 --block-size 67108864 \
            --out out/shard-001-fast.jsonl.gz \
            --audit out/shard-001-fast.audit.json
          end=$(date +%s)
          python - "$start" "$end" <<'PY'
          import json,sys,pathlib
          p=pathlib.Path('out/shard-001-fast.audit.json')
          d=json.loads(p.read_text())
          sec=int(sys.argv[2])-int(sys.argv[1])
          d['wall_seconds']=sec
          d['MiB_per_sec_total_file']=d['remote_total_bytes']/1048576/sec if sec else None
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Persist benchmark
        run: |
          dest='解析/K3全公開データコンパイル/v6/fast-benchmark'
          mkdir -p "$dest"
          cp out/shard-001-fast.audit.json "$dest/"
          git config user.name 'k3-hds-stream-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$dest"
          git commit -m 'K3 shard1 Range並列benchmarkを保存'
          git push origin HEAD:chappie/k3-hds-stream-v6
