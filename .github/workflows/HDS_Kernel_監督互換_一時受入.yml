name: HDS Kernel 監督互換 一時受入

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/HDS_Kernel_監督互換_一時受入.yml"

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: 構文
        run: python -m compileall -q src tests
      - name: 監督Kernel境界回帰
        run: |
          python -m unittest -v \
            tests.test_HDS監督選択実行系 \
            tests.test_HDS監督構造 \
            tests.test_実行系_HDS_v1
