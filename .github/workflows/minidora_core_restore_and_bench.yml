name: MINIDORA minimal generic core restore and bench

on:
  push:
    branches: [main]
    paths:
      - ".sandbox-apply/**"
      - ".github/workflows/minidora_core_restore_and_bench.yml"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  restore-test-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 最小汎用coreへ還元
        id: restore
        shell: bash
        run: |
          set -uo pipefail
          cat .sandbox-apply/apply_*.b64 > /tmp/apply.b64
          base64 -d /tmp/apply.b64 > /tmp/apply.py.gz
          gzip -dc /tmp/apply.py.gz > /tmp/apply.py
          python /tmp/apply.py
          APPLY_STATUS=$?
          if [ "$APPLY_STATUS" -ne 0 ]; then
            echo "変換失敗。bootstrapだけ除去して終了する。"
            git reset --hard HEAD
            rm -rf .sandbox-apply
            rm -f .github/workflows/minidora_core_restore_and_bench.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "一時還元ランナーを除去（変換失敗）" || true
            git push origin HEAD:main || true
            exit "$APPLY_STATUS"
          fi
          rm -rf .sandbox-apply
          rm -f .github/workflows/minidora_core_restore_and_bench.yml

      - name: パッケージ導入
        run: python -m pip install -e .

      - name: 全体検証
        id: validate
        shell: bash
        run: |
          set +e
          python tools/repository_consistency_check.py; S1=$?
          python tools/日本語基底監査.py; S2=$?
          python -m compileall -q src tests tools; S3=$?
          python -m unittest discover -s tests -v; S4=$?
          python -m minidora "2+3"; S5=$?
          git diff --check; S6=$?
          if [ "$S1" -ne 0 ] || [ "$S2" -ne 0 ] || [ "$S3" -ne 0 ] || [ "$S4" -ne 0 ] || [ "$S5" -ne 0 ] || [ "$S6" -ne 0 ]; then
            exit 1
          fi

      - name: 検証失敗時bootstrapを除去
        if: failure() && steps.restore.outcome == 'success'
        shell: bash
        run: |
          git reset --hard HEAD
          rm -rf .sandbox-apply
          rm -f .github/workflows/minidora_core_restore_and_bench.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "一時還元ランナーを除去（全体検証失敗）" || true
          git push origin HEAD:main || true

      - name: 完成差分をmainへ還元
        id: commit_core
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MINIDORAを最小汎用LLM coreへ復帰"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: GPQA Diamond 198問 最小汎用core実測
        if: success()
        run: python tools/benchmark_formal.py gpqa-diamond --controlled-ab --out gpqa_minimal_generic_core.json

      - name: 実測記録を生成
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path
          src = Path('gpqa_minimal_generic_core.json')
          data = json.loads(src.read_text(encoding='utf-8'))
          out = Path('評価/GPQA_Diamond_MINIMAL_GENERIC_CORE_2026-08-31.summary.json')
          summary = {
              'title': 'MINIDORA GPQA Diamond minimal generic core measurement',
              'source_commit': '${{ steps.commit_core.outputs.sha }}',
              'measured_at_jst': datetime.now(timezone(timedelta(hours=9))).isoformat(),
              'protocol': data.get('protocol', {}),
              'metrics': data.get('metrics', {}),
              'controlled_baseline': data.get('controlled_baseline'),
              'controlled_delta': data.get('controlled_delta'),
              'comparison_reference': data.get('comparison_reference'),
          }
          out.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          metrics = summary['metrics']
          baseline = summary.get('controlled_baseline') or {}
          delta = summary.get('controlled_delta') or {}
          md = Path('評価/GPQA_Diamond_MINIMAL_GENERIC_CORE_2026-08-31.md')
          md.write_text(
              '# MINIDORA GPQA Diamond — 最小汎用core実測\n\n'
              f'- source commit: `{summary["source_commit"]}`\n'
              f'- completed: {metrics.get("completed")}\n'
              f'- correct: {metrics.get("correct")}\n'
              f'- accuracy: {metrics.get("accuracy_percent")}%\n'
              f'- answered: {metrics.get("answered")}\n'
              f'- answer rate: {metrics.get("answer_rate_percent")}%\n'
              f'- answered accuracy: {metrics.get("answered_accuracy_percent")}%\n'
              f'- specialist actions: {metrics.get("specialist_actions_invoked")}\n'
              f'- HDS interventions: {metrics.get("hds_supervisory_interventions")}\n\n'
              '## Controlled baseline\n\n'
              '```json\n' + json.dumps(baseline, ensure_ascii=False, indent=2) + '\n```\n\n'
              '## Controlled delta\n\n'
              '```json\n' + json.dumps(delta, ensure_ascii=False, indent=2) + '\n```\n',
              encoding='utf-8',
          )
          PY

      - name: ベンチ結果をmainへ記録
        if: success()
        shell: bash
        run: |
          git add 評価/GPQA_Diamond_MINIMAL_GENERIC_CORE_2026-08-31.summary.json 評価/GPQA_Diamond_MINIMAL_GENERIC_CORE_2026-08-31.md
          git commit -m "最小汎用core GPQA Diamond実測を記録"
          git push origin HEAD:main

      - name: 測定成果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minidora-gpqa-minimal-generic-core
          path: |
            gpqa_minimal_generic_core.json
            評価/GPQA_Diamond_MINIMAL_GENERIC_CORE_2026-08-31.summary.json
            評価/GPQA_Diamond_MINIMAL_GENERIC_CORE_2026-08-31.md
          if-no-files-found: warn
