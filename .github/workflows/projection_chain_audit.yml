name: MINIDORA 三層射影Compiler監査

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/minidora/言語基底_英日意味強化.py"
      - "src/minidora/hds_language_semantic_bridge.py"
      - "src/minidora/hds_language_relations.py"
      - "src/minidora/hds_runtime_projection.py"
      - "src/minidora/hds_choice_hypothesis.py"
      - "src/minidora/hds_model_projection.py"
      - "src/minidora/能力作用則.py"
      - "src/minidora/模型.py"
      - "tools/audit_projection_chain.py"
      - ".github/workflows/projection_chain_audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: GPQA意味射影監査
        run: python tools/audit_projection_chain.py
      - name: 監査成果を保存
        uses: actions/upload-artifact@v4
        with:
          name: minidora-projection-chain-audit
          path: projection_chain_audit.json
          if-no-files-found: error
