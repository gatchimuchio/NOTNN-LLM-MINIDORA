name: 第26バッチ再開監査修正の同一性検査
on:
  push:
    branches: ['transport/batch26-audit-fix-20260914']
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 固定差分と完成treeを照合
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet f54ecd3d62dd59ef609dcab8e458c1244a195c2c -- . ':(exclude).github/workflows/batch26_audit_fix.yml'
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          text=''
          packed=base64.b64decode(text,validate=True)
          assert hashlib.sha256(packed).hexdigest()=='9f153b341e2c220449f3ad5a3c7e6c02c1846fecc2022d58567ecc68491fe00d'
          patch=gzip.decompress(packed)
          assert hashlib.sha256(patch).hexdigest()=='5f6ba80193fc5bc459cebd01dc492863227ceda84cceedf9bb535602ef41202b'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
          git rm .github/workflows/batch26_audit_fix.yml
          test "$(git write-tree)" = c0dd4511040fd2d78803cc2a461751c03ac123ad
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: 原記載を使わない導出と未導出の説明を区別'
          git push origin HEAD:transport/batch26-audit-fix-20260914
