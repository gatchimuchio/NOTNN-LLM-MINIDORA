name: MINIDORA 学習循環 一時診断
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/一時_学習循環診断.yml"
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: 第二層回復診断
        run: |
          python - <<'PY'
          from tests.test_HDS正本継承循環_v1 import HDS正本継承循環試験, 第二層追加参照
          from minidora.HDS構文化器_v1 import 公開HDSコンパイラ
          from minidora.HDS駆動コア import HDS駆動コア
          from minidora.HDS選択継承循環 import 回答成果名
          t=HDS正本継承循環試験()
          t.構文化器=公開HDSコンパイラ()
          t.コア=HDS駆動コア(HDSコンパイラ=t.構文化器,最大作用回数=24)
          t.問い="Which molecule inhibits Enzyme X?"
          t.選択肢=("Molecule A","Molecule B")
          p=第二層追加参照()
          r=t.コア.選択実行(t.問い,t.選択肢,初期参照=(),参照供給器=p)
          print("終端",r.終端,"理由",r.理由)
          print("残差",sorted(r.状態.残差))
          print("回答",r.状態.成果辞書().get(回答成果名))
          print("問合せ",p.呼出)
          for h in r.履歴:
              print("履歴",h.番号,h.作用ID,h.理由,"追加",h.状態差.追加残差,"解消",h.状態差.解消残差,"成果差",h.状態差.変更成果)
          PY
