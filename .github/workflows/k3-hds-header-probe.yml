name: K3 HDS Header Full Probe

on:
  push:
    branches:
      - chappie/k3-hds-stream-v6
    paths:
      - tools/k3_hds_header_probe.py
      - tools/k3_hds_stream_compile.py
      - .github/workflows/k3-hds-header-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/k3-hds-stream-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Probe all 96 safetensors headers and official index
        run: |
          mkdir -p out
          python tools/k3_hds_header_probe.py \
            --out-summary out/header-probe-summary.json \
            --out-manifest out/tensor-address-manifest.jsonl.gz
      - name: Persist header probe to dedicated branch
        if: success()
        run: |
          dest='解析/K3全公開データコンパイル/v6/header-probe'
          mkdir -p "$dest"
          cp out/header-probe-summary.json "$dest/"
          cp out/tensor-address-manifest.jsonl.gz "$dest/"
          git config user.name 'k3-hds-stream-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$dest"
          git commit -m 'K3 96 shard header全数監査結果を保存'
          git push origin HEAD:chappie/k3-hds-stream-v6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3-hds-header-probe
          path: out/
          if-no-files-found: error
          retention-days: 7
