name: MINIDORA 候補仮説射影パッチ適用

on:
  push:
    branches: [chappie/perf-v08-hypothesis-projection]
    paths:
      - '.github/workflows/chappie_apply_hypothesis_patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/perf-v08-hypothesis-projection
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: relation局所判定を修正
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/minidora/k3_hds_native.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if edges:\n            relations.add(relation_type)\n\n    return frozenset(relations), tuple(edges)\n'''
          new = '''        if any(edge.関係 == relation_type for edge in edges):\n            relations.add(relation_type)\n\n    return frozenset(relations), tuple(edges)\n'''
          if old not in text:
              raise SystemExit('relation-local patch marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile src/minidora/k3_hds_native.py
          git diff --check
      - name: 変更を作業ブランチへ記録
        run: |
          git config user.name 'がっちむち♂'
          git config user.email 'ohira.teppei@gmail.com'
          git add src/minidora/k3_hds_native.py
          git commit -m 'fix: 候補仮説関係の局所生成だけを採用'
          git push origin HEAD:chappie/perf-v08-hypothesis-projection
