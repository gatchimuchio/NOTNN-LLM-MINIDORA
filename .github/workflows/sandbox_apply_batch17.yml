name: サンドボックス検証済み第17バッチ還元
on:
  push:
    branches: [sandbox/capability-planner-20260911]
    paths: [.github/workflows/sandbox_apply_batch17.yml]
permissions:
  contents: write
jobs:
  restore:
    if: github.repository == 'gatchimuchio/NOTNN-LLM-MINIDORA'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: 固定差分の照合・適用・作業ブランチ限定還元
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path, PurePosixPath
          branch = 'sandbox/capability-planner-20260911'
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          def git(*args):
              return subprocess.check_output(['git', *args]).decode('utf-8').strip()
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          assert not git('status', '--porcelain')
          parts = [f'.sandbox_batch17_part{i}.b64' for i in range(3)]
          temporary = parts + ['.github/workflows/sandbox_source_snapshot.yml',
                               '.github/workflows/sandbox_apply_batch17.yml']
          encoded = ''.join(Path(p).read_text().strip() for p in parts)
          raw = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'fc2f163ddcd19deefd4b6a6c44857b589e81d61b174e7ee73deb636bfaa7a9aa'
          decoder = lzma.LZMADecompressor(memlimit=200_000_000)
          decoded = decoder.decompress(raw, max_length=500_000)
          assert decoder.eof and not decoder.unused_data
          data = json.loads(decoded)
          manifest = data['manifest']
          base = 'fedc9e5a9cf7035ac07b219bab592bec24b98ad9'
          assert manifest['base'] == base
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changes = set(subprocess.check_output(['git', 'diff', '--name-only', '-z', base, 'HEAD']).decode().strip('\0').split('\0'))
          assert changes <= set(temporary)
          allowed = {
              'docs/汎用Capability_開発進捗.md', 'docs/汎用チャット_実装ロードマップ.md',
              'src/minidora/HDS目的射影.py', 'src/minidora/汎用要求IR.py',
              'src/minidora/目的会話.py', 'src/minidora/目的計画.py',
              'src/minidora/統合実行.py', 'src/minidora/能力意味カタログ.py',
              'tests/test_目的会話.py', 'tests/test_目的計画.py', 'tools/目的チャット.py',
              '設計/53_MINIDORA_目的駆動計画_v0_1.md',
              '評価/目的駆動計画_v0_1_検証_2026-09-11.md',
          }
          assert len(manifest['files']) == len(allowed)
          assert {f['path'] for f in manifest['files']} == allowed
          for f in manifest['files']:
              p = Path(f['path'])
              assert not p.is_symlink() and not PurePosixPath(f['path']).is_absolute()
              assert '..' not in PurePosixPath(f['path']).parts
              if f['before'] is None:
                  assert not p.exists(), f['path']
              else:
                  assert git('hash-object', f['path']) == f['before'], f['path']
          patch = Path('.git/batch17.patch')
          patch.write_bytes(data['patch'].encode('utf-8'))
          subprocess.run(['git', 'apply', '--index', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0'))
          assert staged == allowed
          for f in manifest['files']:
              content = Path(f['path']).read_bytes()
              assert len(content) == f['bytes'], f['path']
              assert hashlib.sha256(content).hexdigest() == f['sha256'], f['path']
              assert git('hash-object', f['path']) == f['blob'], f['path']
              print('一致:', f['path'], f['blob'])
          subprocess.run(['git', 'rm', '--', *temporary], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'feat: 目的から既存能力を計画・実行する日本語入口'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], check=True)
          output = Path('/tmp/batch17-returned')
          output.mkdir()
          (output / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (output / 'commit.txt').write_text(git('rev-parse', 'HEAD') + '\n')
          subprocess.run(['git', 'archive', '--format=zip', 'HEAD', '-o', str(output / 'files.zip'), '--', *sorted(allowed)], check=True)
          print('還元commit:', git('rev-parse', 'HEAD'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minidora-batch17-returned
          path: /tmp/batch17-returned/
          retention-days: 7
          if-no-files-found: error
