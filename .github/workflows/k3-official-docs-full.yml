name: K3 Official GitHub and Blog Full HDS Compile
# isolated-output-v2

on:
  push:
    branches: [chappie/k3-hds-stream-v6]
    paths:
      - tools/k3_official_docs_compile.py
      - .github/workflows/k3-official-docs-full.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/k3-hds-stream-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow pymupdf
      - name: Compile pinned official GitHub and current official K3 Tech Blog
        run: |
          mkdir -p /tmp/k3docs
          python tools/k3_official_docs_compile.py \
            --out /tmp/k3docs/official-docs-HDS-日本語意味構文.jsonl \
            --audit /tmp/k3docs/official-docs-full-audit.json \
            --mother /tmp/k3docs/official-docs-mother-set.json
          gzip -9 /tmp/k3docs/official-docs-HDS-日本語意味構文.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k3-official-docs-hds-full
          path: /tmp/k3docs/
          compression-level: 0
          retention-days: 30
      - name: Publish isolated official-docs branch
        if: success()
        run: |
          git config user.name 'k3-hds-docs-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --orphan k3-official-docs-out
          git rm -rf .
          cp /tmp/k3docs/official-docs-full-audit.json audit.json
          cp /tmp/k3docs/official-docs-mother-set.json mother-set.json
          cp /tmp/k3docs/official-docs-HDS-日本語意味構文.jsonl.gz semantic.jsonl.gz
          git add audit.json mother-set.json semantic.jsonl.gz
          git commit -m 'K3 official docs full HDS compile'
          git push --force origin HEAD:chappie/k3-official-docs-v6
