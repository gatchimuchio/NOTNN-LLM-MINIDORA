name: MINIDORA local interpretation benchmark

on:
  push:
    branches: [bench/local-interpretation-20260909]

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: 局所解釈連続性 A/B 100ケース
        run: python tools/benchmark_local_interpretation.py
      - name: 結果保存
        uses: actions/upload-artifact@v4
        with:
          name: minidora-local-interpretation-benchmark
          path: local_interpretation_benchmark.json
          if-no-files-found: error

  gpqa:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: GPQA Diamond 198問 正式模型核 controlled A/B実測
        run: python tools/benchmark_formal.py gpqa-diamond --controlled-ab --out gpqa_local_interpretation_measurement.json
      - name: 結果要約
        if: always()
        run: |
          if [ -f gpqa_local_interpretation_measurement.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('gpqa_local_interpretation_measurement.json').read_text(encoding='utf-8'))
          print(json.dumps(data['protocol'], ensure_ascii=False, indent=2))
          print(json.dumps(data['metrics'], ensure_ascii=False, indent=2))
          print(json.dumps(data.get('controlled_baseline'), ensure_ascii=False, indent=2))
          print(json.dumps(data.get('controlled_delta'), ensure_ascii=False, indent=2))
          PY
          fi
      - name: 結果保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minidora-gpqa-local-interpretation-measurement
          path: gpqa_local_interpretation_measurement.json
          if-no-files-found: warn
