name: K3 HF Official Identity Inventory
# isolated-output-v2

on:
  push:
    branches: [chappie/k3-hds-stream-v6]
    paths:
      - tools/k3_hf_identity_inventory.py
      - .github/workflows/k3-hf-identity-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/k3-hds-stream-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check huggingface_hub
      - run: |
          mkdir -p /tmp/k3id
          python tools/k3_hf_identity_inventory.py --out /tmp/k3id/hf-official-file-identities.json
      - name: Publish isolated identity branch
        run: |
          git config user.name 'k3-hds-identity-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --orphan k3-hf-identity-out
          git rm -rf .
          cp /tmp/k3id/hf-official-file-identities.json latest.json
          git add latest.json
          git commit -m 'K3 HF official file identities'
          git push --force origin HEAD:chappie/k3-hf-identity-v6
