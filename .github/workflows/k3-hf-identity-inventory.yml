name: K3 HF Official Identity Inventory

on:
  push:
    branches: [chappie/k3-hds-stream-v6]
    paths:
      - tools/k3_hf_identity_inventory.py
      - .github/workflows/k3-hf-identity-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/k3-hds-stream-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check huggingface_hub
      - run: |
          mkdir -p out
          python tools/k3_hf_identity_inventory.py --out out/hf-official-file-identities.json
      - name: Persist official identity inventory
        run: |
          dest='解析/K3全公開データコンパイル/v6/mother-set'
          mkdir -p "$dest"
          cp out/hf-official-file-identities.json "$dest/"
          git config user.name 'k3-hds-stream-bot'
          git config user.email 'actions@users.noreply.github.com'
          git pull --rebase origin chappie/k3-hds-stream-v6
          git add "$dest/hf-official-file-identities.json"
          git commit -m 'K3公式HF file identity台帳を保存' || true
          git push origin HEAD:chappie/k3-hds-stream-v6
