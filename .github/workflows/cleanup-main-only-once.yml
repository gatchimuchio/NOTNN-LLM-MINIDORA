name: main一本化 一回限りcleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-main-only-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: main以外のremote branchを削除
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(git ls-remote --heads origin | sed 's#.*refs/heads/##' | grep -v '^main$' || true)
          printf 'delete targets:\n%s\n' "${branches[*]:-none}"
          for b in "${branches[@]}"; do
            git push origin --delete "$b"
          done
          remaining=$(git ls-remote --heads origin | sed 's#.*refs/heads/##')
          test "$remaining" = "main"
      - name: cleanup workflow自身をmainから除去
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'main-only-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/cleanup-main-only-once.yml
          git commit -m '一時branch整理: cleanup workflowを除去'
          git push origin main
