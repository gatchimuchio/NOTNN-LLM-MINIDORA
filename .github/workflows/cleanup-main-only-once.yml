name: cleanup-main-only-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-main-only-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete all non-main branches
        run: |
          git config user.name 'main-only-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#refs/heads/##' \
            | grep -v '^main$' \
            | while read -r branch; do
                echo "delete: $branch"
                git push origin --delete "$branch" || true
              done
      - name: Remove this one-shot workflow
        run: |
          git checkout main
          git pull --ff-only origin main
          git rm .github/workflows/cleanup-main-only-once.yml
          git commit -m 'main一本運用: 一時cleanup workflowを除去'
          git push origin main
