name: Cancel obsolete GLM D4 audit runs

on:
  push:
    paths:
      - ".github/workflows/cancel_glm_duplicate.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete GLM D4 runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST repos/${{ github.repository }}/actions/runs/33557724147/cancel || true
          gh api --method POST repos/${{ github.repository }}/actions/runs/33557727984/cancel || true
          gh api --method POST repos/${{ github.repository }}/actions/runs/33558839608/cancel || true
          gh api --method POST repos/${{ github.repository }}/actions/runs/33559551332/cancel || true
