# export trigger: current K3 HDS canonical bundle
name: Export K3 HDS current bundle for chat

on:
  push:
    paths:
      - '.github/workflows/export_k3_hds_current_for_chat.yml'

permissions:
  contents: write
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download canonical release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p export
          gh release download k3-hds-v6.1-current-9f62e4e \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'K3_HDS_JA_CURRENT_CANONICAL_BUNDLE_v6_1.zip' \
            --pattern 'K3_HDS_JA_CURRENT_CANONICAL_BUNDLE_v6_1.zip.sha256' \
            --dir export
          cd export
          sha256sum -c K3_HDS_JA_CURRENT_CANONICAL_BUNDLE_v6_1.zip.sha256
      - name: Upload current canonical bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: K3_HDS_JA_CURRENT_CANONICAL_BUNDLE_v6_1
          path: export/*
          compression-level: 0
          retention-days: 90
      - name: Record export artifact
        run: |
          mkdir -p artifacts/k3-hds/current
          cat > artifacts/k3-hds/current/chat-export.json <<EOF
          {
            "run_id": ${{ github.run_id }},
            "artifact_id": ${{ steps.upload.outputs.artifact-id }},
            "artifact_name": "K3_HDS_JA_CURRENT_CANONICAL_BUNDLE_v6_1",
            "source_release": "k3-hds-v6.1-current-9f62e4e",
            "source_sha256": "a862f4a65ff0c09a5c31c3790958b5d90acfa46fc6d90fea18e691e44175d7f3"
          }
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add artifacts/k3-hds/current/chat-export.json
          git commit -m 'Record K3 HDS current chat export' || exit 0
          git push
