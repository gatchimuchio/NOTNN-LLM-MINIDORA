name: HDS Compiler v1.1 builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.head_ref == 'chappie/hds-compiler-v1-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/hds-compiler-v1-1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: v1.1統合差分を適用
        run: python tools/_apply_hds_v1_1.py
      - name: 一時builderを正本監査対象から除外
        run: rm -f .github/workflows/_hds_v1_1_builder.yml
      - name: リポジトリ整合性監査
        run: python tools/repository_consistency_check.py
      - name: 構文確認
        run: python -m compileall -q src tests tools
      - name: 全単体試験
        run: python -m unittest discover -s tests -v
      - name: 一時ファイルを除去して検証済み差分を固定
        shell: bash
        run: |
          rm -f tools/_apply_hds_v1_1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: HDS Compiler Architecture v1.1を統合'
          git push origin HEAD:chappie/hds-compiler-v1-1
