name: MINIDORA 実行内学習 一時受入

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/一時_実行内学習受入.yml"

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: 実行内学習と選択継承の局所受入
        run: |
          python -m unittest -v \
            tests.test_HDS実行内学習循環_v1 \
            tests.test_HDS正本継承循環_v1 \
            tests.test_実行系_HDS_v1
