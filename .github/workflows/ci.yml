name: MINIDORA 再構築CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 構文確認
        run: python -m compileall -q src tests
      - name: 単体試験
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
