name: sandbox local interpretation decision v2

on:
  push:
    branches: [sandbox/local-interpretation-decision-v2-20260909]

permissions:
  contents: write

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: パッチ適用可能性確認
        run: git apply --check --recount .sandbox/local_interpretation_decision_v2.patch
      - name: パッチ適用
        run: git apply --recount .sandbox/local_interpretation_decision_v2.patch
      - name: 一時ファイル除去
        run: |
          rm .sandbox/local_interpretation_decision_v2.patch
          rm .github/workflows/sandbox_apply_local_interpretation_v2.yml
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: 局所解釈 targeted tests
        run: python -m unittest tests.test_局所解釈連続性 -v
      - name: 100ケース因果貫通A/B
        run: |
          python - <<'PY'
          from minidora.runtime import ミニドラ, 要求
          from minidora.hds_compiler_v1 import 公開HDSコンパイラ

          for hds in (False, True):
              for i in range(1, 101):
                  body = ミニドラ(HDSコンパイラ_=公開HDSコンパイラ()) if hds else ミニドラ()
                  left = i * 3 + 2
                  rhs = i % 9 + 1
                  first = body.実行(要求(f'{left}+0'))
                  assert first.値 == left, (hds, i, first)
                  second = body.実行(要求(f'それに{rhs}を足して'))
                  assert second.値 == left + rhs, (hds, i, second.値, left + rhs)
                  assert second.状態['局所解釈起点']['直前結果'] == left

                  body.局所解釈を初期化()
                  reset = body.実行(要求(f'それに{rhs}を足して'))
                  assert reset.値 != left + rhs, (hds, i, reset.値)
          print('causal continuity benchmark: 200 retained + 200 reset cases PASS')
          PY
      - name: リポジトリ整合性監査
        run: python tools/repository_consistency_check.py
      - name: 日本語基底監査
        run: python tools/日本語基底監査.py
      - name: 構文確認
        run: python -m compileall -q src tests tools
      - name: 全単体試験
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: python -m minidora '2+3'
      - name: 検証済み差分をsandbox branchへ確定
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: 局所解釈を最終意思決定まで貫通させる'
          git push origin HEAD:sandbox/local-interpretation-decision-v2-20260909
