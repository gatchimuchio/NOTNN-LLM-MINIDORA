name: MINIDORA generic core improvements apply

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply_generic_core_improvements.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: サンドボックス差分を検証して適用
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/proposed.patch <<'PATCH'
          diff --git "a/src/minidora/\346\250\241\345\236\213.py" "b/src/minidora/\346\250\241\345\236\213.py"
          index 13bc7ae..fa38204 100644
          --- "a/src/minidora/\346\250\241\345\236\213.py"
          +++ "b/src/minidora/\346\250\241\345\236\213.py"
          @@ -9,6 +9,13 @@ class 言語対応:
               def 文脈化(self,現在,履歴:Sequence[言語状態]=(),条件:Sequence[str]=(),参照状態:Sequence[言語状態]=()):
                   for state in (*履歴,*参照状態):
                       if state.言語体系!=現在.言語体系: raise ValueError("同一の文脈評価内で言語体系を無言混在させない")
          -        return 文脈付き言語状態(self.内部化(現在),tuple(self.内部化(x) for x in 履歴),tuple(str(x) for x in 条件),tuple(self.内部化(x) for x in 参照状態))
          +        # 同一の意味・関係構造を持つDataを、出典IDが違うだけで複数票へ増幅しない。
          +        references=[]; seen_reference=set()
          +        for state in 参照状態:
          +            internal=self.内部化(state)
          +            signature=internal.構造署名
          +            if signature in seen_reference: continue
          +            seen_reference.add(signature); references.append(internal)
          +        return 文脈付き言語状態(self.内部化(現在),tuple(self.内部化(x) for x in 履歴),tuple(str(x) for x in 条件),tuple(references))
           
           class 模型関係(Protocol):
          diff --git "a/src/minidora/\350\203\275\345\212\233\347\212\266\346\205\213\345\267\256\345\276\252\347\222\260.py" "b/src/minidora/\350\203\275\345\212\233\347\212\266\346\205\213\345\267\256\345\276\252\347\222\260.py"
          index c636a87..a33ca9c 100644
          --- "a/src/minidora/\350\203\275\345\212\233\347\212\266\346\205\213\345\267\256\345\276\252\347\222\260.py"
          +++ "b/src/minidora/\350\203\275\345\212\233\347\212\266\346\205\213\345\267\256\345\276\252\347\222\260.py"
          @@ -3,10 +3,20 @@
                           break
           
                       scores = work.得点()
          +            ordered = sorted(ids, key=lambda cid: (-scores[cid], cid))
                       changed = sorted(pending.変化候補ID, key=lambda cid: (-scores[cid], cid))
          -            active = list(changed[:2])
          +            # 再作用は「変化した候補どうし」だけで閉じず、現在の成立境界を必ず含める。
          +            # 現在首位 + 最も強い変化候補を比較し、首位自身が変化候補なら次の変化候補を使う。
          +            active: list[str] = []
          +            if ordered:
          +                active.append(ordered[0])
          +            for cid in changed:
          +                if cid not in active:
          +                    active.append(cid)
          +                if len(active) >= 2:
          +                    break
                       if len(active) < 2:
          -                for cid in sorted(ids, key=lambda item: (-scores[item], item)):
          +                for cid in ordered:
                               if cid not in active:
                                   active.append(cid)
                                   break
          diff --git "a/tests/test_\350\203\275\345\212\233\347\212\266\346\205\213\345\267\256\345\276\252\347\222\260_v1.py" "b/tests/test_\350\203\275\345\212\233\347\212\266\346\205\213\345\267\256\345\276\252\347\222\260_v1.py"
          index ac66b91..ae4cfb2 100644
          --- "a/tests/test_\350\203\275\345\212\233\347\212\266\346\205\213\345\267\256\345\276\252\347\222\260_v1.py"
          +++ "b/tests/test_\350\203\275\345\212\233\347\212\266\346\205\213\345\267\256\345\276\252\347\222\260_v1.py"
          @@ -1,5 +1,59 @@
          -from minidora.模型 import 成立候補, 言語状態
          +from minidora.模型 import 成立候補, 言語状態, 関係寄与
           
           
           class 能力状態差循環V1試験(unittest.TestCase):
          +    def test_再作用は現在首位と最強変化候補を比較する(self) -> None:
          +        class 初期差:
          +            名称 = "初期差"
          +
          +            def 評価(self, 文脈, 候補):
          +                if "leader" in 候補.意味語集合:
          +                    return 関係寄与(self.名称, 5, ("leader",))
          +                if "challenger" in 候補.意味語集合:
          +                    return 関係寄与(self.名称, 2, ("challenger",))
          +                if "decoy" in 候補.意味語集合:
          +                    return 関係寄与(self.名称, 1, ("decoy",))
          +                return None
          +
          +        class 境界再作用:
          +            名称 = "境界再作用"
          +
          +            def 評価群(self, 文脈, 候補群):
          +                out = {}
          +                for cid, state in 候補群:
          +                    if "challenger" in state.意味語集合:
          +                        out[cid] = 関係寄与(self.名称, 2, ("primary",))
          +                    elif "decoy" in state.意味語集合:
          +                        out[cid] = 関係寄与(self.名称, 2, ("primary",))
          +                return out
          +
          +            def 再評価群(self, 文脈, 候補群, round_index):
          +                tokens = {cid: state.意味語集合 for cid, state in 候補群}
          +                leader = next((cid for cid, vals in tokens.items() if "leader" in vals), None)
          +                challenger = next((cid for cid, vals in tokens.items() if "challenger" in vals), None)
          +                if leader is None or challenger is None:
          +                    return {}
          +                return {
          +                    challenger: 関係寄与(
          +                        f"境界再作用:{round_index}", 3, ("leader-vs-challenger",)
          +                    )
          +                }
          +
          +        core = MINIDORA能力状態差模型核(
          +            (初期差(),),
          +            能力作用群=(境界再作用(),),
          +            最大再作用回数=1,
          +        )
          +        result = core.評価言語状態(
          +            言語状態("question"),
          +            (
          +                成立候補("A", 言語状態("leader")),
          +                成立候補("B", 言語状態("challenger")),
          +                成立候補("C", 言語状態("decoy")),
          +            ),
          +        )
          +        self.assertEqual(result.最有力候補ID, "B")
          +        self.assertEqual(result.統計.checkpoint再活性数, 1)
          +        self.assertGreaterEqual(result.統計.候補横断更新数, 1)
          +
               def test_状態差がなければ再作用しない(self) -> None:
          diff --git "a/tests/test_\345\217\202\347\205\247Data\351\235\236\345\242\227\345\271\205.py" "b/tests/test_\345\217\202\347\205\247Data\351\235\236\345\242\227\345\271\205.py"
          new file mode 100644
          index 0000000..9bd615d
          --- /dev/null
          +++ "b/tests/test_\345\217\202\347\205\247Data\351\235\236\345\242\227\345\271\205.py"
          @@ -0,0 +1,45 @@
          +from __future__ import annotations
          +
          +import unittest
          +
          +from minidora.能力状態差循環 import 標準能力模型核
          +from minidora.模型 import 成立候補, 言語状態
          +
          +
          +class 参照Data非増幅試験(unittest.TestCase):
          +    def _評価(self, refs):
          +        return 標準能力模型核().評価言語状態(
          +            言語状態("which"),
          +            (
          +                成立候補("A", 言語状態("alpha")),
          +                成立候補("B", 言語状態("beta")),
          +            ),
          +            参照状態=tuple(refs),
          +        )
          +
          +    def test_同一Dataの出典ID違いは票を増幅しない(self) -> None:
          +        base = self._評価((
          +            言語状態("alpha", 識別子="r-alpha"),
          +            言語状態("beta", 識別子="r-beta-1"),
          +        ))
          +        duplicated = self._評価((
          +            言語状態("alpha", 識別子="r-alpha"),
          +            言語状態("beta", 識別子="r-beta-1"),
          +            言語状態("beta", 識別子="r-beta-2"),
          +        ))
          +        self.assertEqual(len(duplicated.文脈.参照状態), 2)
          +        self.assertEqual(base.参照候補辞書(), duplicated.参照候補辞書())
          +        self.assertEqual(base.参照最有力候補ID, duplicated.参照最有力候補ID)
          +
          +    def test_異なるDataは別Dataとして保持する(self) -> None:
          +        result = self._評価((
          +            言語状態("alpha first", 識別子="r-alpha"),
          +            言語状態("beta first", 識別子="r-beta-1"),
          +            言語状態("beta second", 識別子="r-beta-2"),
          +        ))
          +        self.assertEqual(len(result.文脈.参照状態), 3)
          +        self.assertEqual(result.参照最有力候補ID, "B")
          +
          +
          +if __name__ == "__main__":
          +    unittest.main()
          PATCH
          git apply --check /tmp/proposed.patch
          git apply /tmp/proposed.patch
      - name: 全体検証
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e .
          python tools/repository_consistency_check.py
          python tools/日本語基底監査.py
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -v
          python -m minidora "2+3"
      - name: mainへ還元し一時runnerを除去
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply_generic_core_improvements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "core: 同一Data非増幅と再作用成立境界を改善"
          git push origin HEAD:main
