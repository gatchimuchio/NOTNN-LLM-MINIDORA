name: 日本語基底正規化 一時適用

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: 日本語基底適用-pr115
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 115 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/japanese-base-normalization-2026-09-15'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/japanese-base-normalization-2026-09-15
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 日本語基底正規化を適用
        run: python tools/日本語基底正規化_実行.py
      - name: 正規化器の構文確認
        run: python -m py_compile tools/日本語基底正規化_一時.py tools/日本語基底正規化_実行.py
      - name: 完成差分を同一ブランチへ還元
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "追加差分なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "日本語基底正規化を一括適用"
          git push origin HEAD:chore/japanese-base-normalization-2026-09-15
