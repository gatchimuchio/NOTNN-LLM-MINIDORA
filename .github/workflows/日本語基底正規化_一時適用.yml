name: 日本語基底正規化 一時検証

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read
  actions: read

concurrency:
  group: 日本語基底検証-pr115
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.pull_request.number == 115 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/japanese-base-normalization-2026-09-15'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/japanese-base-normalization-2026-09-15
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 日本語基底全数監査
        run: python tools/日本語基底監査.py
      - name: リポジトリ整合性監査
        run: python tools/repository_consistency_check.py
      - name: Python構文確認
        run: python -m compileall -q src tests tools
      - name: 全単体試験
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: CLI確認
        run: python -m minidora --help
        env:
          PYTHONPATH: src
