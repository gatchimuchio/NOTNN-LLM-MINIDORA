name: 日本語基底正規化 一時適用

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: 日本語基底正規化-pr115
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 115 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'chore/japanese-base-normalization-2026-09-15'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/japanese-base-normalization-2026-09-15
          fetch-depth: 0
          token: ${{ github.token }}
      - name: 現行mainへ確定成果物を適用
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          rm -rf /tmp/jpnorm && mkdir -p /tmp/jpnorm
          curl -L --fail \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gatchimuchio/NOTNN-LLM-MINIDORA/actions/artifacts/10377706037/zip \
            -o /tmp/jpnorm/artifact.zip
          cd /tmp/jpnorm
          unzip -q artifact.zip
          unzip -q 日本語基底正規化_変更ファイル.zip -d files
          cd "${GITHUB_WORKSPACE}"
          rsync -a --exclude='.github/workflows/' /tmp/jpnorm/files/ ./
          rm -f tests/test_cli.py tests/test_layer0.py
          git restore -- .github/workflows
      - name: 作業ブランチへ原子的に固定
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "cleanup: 日本語基底規定へ全体正規化"
            git push --force-with-lease origin HEAD:chore/japanese-base-normalization-2026-09-15
          fi
