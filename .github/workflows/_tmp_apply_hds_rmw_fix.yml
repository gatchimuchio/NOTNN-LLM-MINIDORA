name: 一時 HDS RMW修正適用

on:
  push:
    branches:
      - fix/hds-rmw-minidora30-floor-20260917
    paths:
      - .github/workflows/_tmp_apply_hds_rmw_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hds-rmw-minidora30-floor-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 修正適用
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/minidora/統合駆動_v2/循環.py')
          text = path.read_text(encoding='utf-8')
          old = '''            辺 = set(結果.依存追加)\n            if 結果.状態 == HDS作用状態.成立:\n                辺 |= {HDS依存辺(a, b) for a in 読取 for b in 産出 if a != b}\n'''
          new = '''            辺 = set(結果.依存追加)\n            if 結果.状態 == HDS作用状態.成立:\n                # 同一作用内でread-modify-writeしたノードは、旧版の読取値を\n                # 同時産出物の親へ自動依存として残さない。残すと作用自身の\n                # 更新直後に出力状態が旧入力依存として失効し、後続再評価より\n                # 同じ作用の再実行が先行する。読取証明は前状態署名として保持し、\n                # 後続作用は更新後ノード署名から依存を形成する。\n                原子的更新ノード = 読取 & 産出\n                自動依存元 = 読取 - 原子的更新ノード\n                辺 |= {HDS依存辺(a, b) for a in 自動依存元 for b in 産出 if a != b}\n'''
          if old not in text:
              raise SystemExit('循環.pyの対象断片が現行mainと一致しないため停止')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_HDS原子的更新非退行.py')
          test.write_text('''from __future__ import annotations\n\nimport unittest\n\nfrom minidora.HDS実行主体 import (\n    HDS実行主体, HDS実行状態, HDS関数作用, HDS作用結果, HDS作用状態, HDS終端,\n)\n\nF = frozenset\n\n\nclass 原子的読取更新非退行試験(unittest.TestCase):\n    def test_読取更新した成果で自分の段階状態を即時失効しない(self):\n        呼出 = []\n\n        def 参照更新(状態):\n            呼出.append("参照")\n            現在 = tuple(状態.成果辞書().get("参照群", ()))\n            return HDS作用結果(\n                HDS作用状態.成立,\n                追加状態=F({"追加参照済み"}),\n                成果=(("参照群", 現在 + ("追加",)),),\n            )\n\n        def 再評価(状態):\n            呼出.append("再評価")\n            return HDS作用結果(\n                HDS作用状態.成立,\n                追加状態=F({"回答確定"}),\n                解消残差=F({"回答未閉包"}),\n                成果=(("回答ラベル", "A"),),\n            )\n\n        参照 = HDS関数作用(\n            "追加参照", 参照更新,\n            入力状態=("初期評価済み",), 出力状態=("追加参照済み",),\n            読取成果=("参照群",), 資源負荷=4,\n        )\n        評価 = HDS関数作用(\n            "再評価", 再評価,\n            入力状態=("追加参照済み",), 出力状態=("回答確定",),\n            解消対象=("回答未閉包",), 読取成果=("参照群",),\n            資源負荷=1, 優先度=3,\n        )\n        状態 = HDS実行状態(\n            要求状態=F({"回答確定"}), 成立状態=F({"初期評価済み"}),\n            残差=F({"回答未閉包"}), 成果=(("参照群", ("初期",)),),\n        )\n        結果 = HDS実行主体((参照, 評価), 最大作用回数=4).実行(状態)\n        self.assertEqual(結果.終端, HDS終端.採用, 結果.理由)\n        self.assertEqual(呼出, ["参照", "再評価"])\n        self.assertEqual([x.作用ID for x in 結果.履歴], ["追加参照", "再評価"])\n        self.assertNotIn("状態:追加参照済み", 結果.履歴[0].状態差.失効対象)\n\n    def test_後続再評価の回答は後の参照変更で失効する(self):\n        def 参照更新(状態):\n            現在 = tuple(状態.成果辞書().get("参照群", ()))\n            return HDS作用結果(\n                HDS作用状態.成立,\n                追加状態=F({"追加参照済み"}),\n                成果=(("参照群", 現在 + ("追加",)),),\n            )\n\n        def 再評価(_状態):\n            return HDS作用結果(\n                HDS作用状態.成立,\n                追加状態=F({"回答確定"}),\n                解消残差=F({"回答未閉包"}),\n                成果=(("回答ラベル", "A"),),\n            )\n\n        参照 = HDS関数作用(\n            "追加参照", 参照更新, 入力状態=("初期評価済み",),\n            出力状態=("追加参照済み",), 読取成果=("参照群",),\n        )\n        評価 = HDS関数作用(\n            "再評価", 再評価, 入力状態=("追加参照済み",),\n            出力状態=("回答確定",), 解消対象=("回答未閉包",),\n            読取成果=("参照群",),\n        )\n        状態 = HDS実行状態(\n            要求状態=F({"回答確定"}), 成立状態=F({"初期評価済み"}),\n            残差=F({"回答未閉包"}), 成果=(("参照群", ("初期",)),),\n        )\n        完了 = HDS実行主体((参照, 評価), 最大作用回数=4).実行(状態)\n        self.assertEqual(完了.終端, HDS終端.採用)\n        更新後, 差 = HDS実行主体._状態更新(\n            完了.状態,\n            HDS作用結果(HDS作用状態.成立, 成果=(("参照群", ("別資料",)),)),\n        )\n        self.assertNotIn("回答確定", 更新後.成立状態)\n        self.assertNotIn("回答ラベル", 更新後.成果辞書())\n        self.assertIn("状態:回答確定", 差.失効対象)\n        self.assertIn("成果:回答ラベル", 差.失効対象)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          design = Path('設計/61_MINIDORA_HDS原子的更新非退行_v1.md')
          design.write_text('''# MINIDORA HDS原子的更新非退行 v1\n\n## 目的\n\nHDS通常循環で、同一作用が同一成果を読みながら更新する read-modify-write を原子的更新として扱う。\nMINIDORA30互換水準を下回ったGPQA同run比較で、追加参照作用が自身の出力状態を即時失効させ、後続再評価より同一作用再実行を優先していた失敗署名を修正する。\n\n## 規則\n\n- 同一作用内で同時に読取・産出されたノードは、旧版読取値から同時産出物への自動依存元にしない。\n- 読取証明そのものは前状態署名として保持し、古い入力からの作用結果を採用しない。\n- 後続作用が更新後成果を読む場合は、更新後ノード署名から通常の依存を形成する。\n- 後から成果が変更された場合、後続再評価結果・回答状態は従来どおり失効する。\n- GPQA固有規則、gold、固定参照資料はコアへ持ち込まない。\n\n## 受入条件\n\n1. 原子的更新作用を同じ入力段階で無意味に二重実行しない。\n2. 更新直後に後続再評価へ進める。\n3. 後続成果の依存失効は維持する。\n4. 全リポジトリCIを通過する。\n5. LIVE_ONLY同run A/BでHDS-v3がMINIDORA30互換の正答数を下回らない。\n''', encoding='utf-8')
          PY
          rm .github/workflows/_tmp_apply_hds_rmw_fix.yml
      - name: 差分確認とcommit
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name 'gatchimuchio'
          git config user.email 'ohira.teppei@gmail.com'
          git add -A
          git commit -m 'fix: HDS原子的更新の自己失効を防止'
          git push origin HEAD:fix/hds-rmw-minidora30-floor-20260917
