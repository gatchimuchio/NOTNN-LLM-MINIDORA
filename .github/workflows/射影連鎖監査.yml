name: MINIDORA 三層射影構文化器監査

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/minidora/言語基底_英日意味.py"
      - "src/minidora/言語基底_英日意味強化.py"
      - "src/minidora/HDS言語意味橋渡し.py"
      - "src/minidora/HDS言語関係.py"
      - "src/minidora/HDS実行系射影.py"
      - "src/minidora/HDS選択仮説.py"
      - "src/minidora/HDS模型射影.py"
      - "src/minidora/能力作用則.py"
      - "src/minidora/模型.py"
      - "tools/射影連鎖監査.py"
      - "tests/test_射影_監査_境界.py"
      - "tests/test_射影_連鎖_忠実度_v1.py"
      - "tests/test_HDS_残差_証拠.py"
      - ".github/workflows/射影連鎖監査.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: 意味被覆・人工射影契約監査
        run: python tools/射影連鎖監査.py
      - name: 監査成果を保存
        uses: actions/upload-artifact@v4
        with:
          name: MINIDORA-射影連鎖監査
          path: 射影連鎖監査.json
          if-no-files-found: error
