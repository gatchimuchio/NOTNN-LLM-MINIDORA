name: K3 HDS Final Assembly Status
# refresh-generation: 3

on:
  push:
    branches: [chappie/k3-hds-stream-v6]
    paths:
      - .github/workflows/k3-hds-final-status.yml

permissions:
  actions: read
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/k3-hds-stream-v6
      - name: Query final assembly workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/finalstatus
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "${api}/actions/workflows/k3-hds-final-assemble.yml/runs?branch=chappie%2Fk3-hds-stream-v6&per_page=10" > /tmp/finalstatus/runs.json
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          runs=json.loads(Path('/tmp/finalstatus/runs.json').read_text())['workflow_runs']
          out=[]
          for r in runs[:5]:
              req=urllib.request.Request(r['jobs_url']+'?per_page=100',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as f: jobs=json.load(f)['jobs']
              out.append({
                'id':r['id'],'run_number':r['run_number'],'status':r['status'],'conclusion':r.get('conclusion'),
                'created_at':r['created_at'],'updated_at':r['updated_at'],'head_sha':r['head_sha'],'html_url':r['html_url'],
                'jobs':[{'id':j['id'],'name':j['name'],'status':j['status'],'conclusion':j.get('conclusion'),'steps':[{'name':s['name'],'status':s['status'],'conclusion':s.get('conclusion'),'number':s['number']} for s in j.get('steps',[])]} for j in jobs]
              })
          Path('/tmp/finalstatus/latest.json').write_text(json.dumps({'runs':out},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'runs':out},ensure_ascii=False,indent=2))
          PY
      - name: Publish isolated status
        run: |
          git config user.name 'k3-hds-final-status-bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --orphan final-status-out
          git rm -rf .
          cp /tmp/finalstatus/latest.json latest.json
          git add latest.json
          git commit -m 'K3 HDS final assembly status'
          git push --force origin HEAD:chappie/k3-hds-final-status-v6
