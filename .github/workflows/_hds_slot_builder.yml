name: HDS slot patch builder

on:
  push:
    branches: [chappie/hds-slot-r-v1]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/hds-slot-r-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 不足スロット改善を適用
        run: python tools/_apply_hds_slot_patch.py
      - name: リポジトリ整合性監査
        run: python tools/repository_consistency_check.py
      - name: 構文確認
        run: python -m compileall -q src tests tools
      - name: 全単体試験
        run: python -m unittest discover -s tests -v
      - name: 検証済み差分をbranchへ固定
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'perf: HDS不足スロットでR query純度を改善'
          git push origin HEAD:chappie/hds-slot-r-v1
