name: Batch21 Transport

on:
  push:
    branches:
      - transport/batch21-20260912

permissions:
  contents: write

jobs:
  apply-verified-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 検証済み第21バッチ差分を適用
        shell: bash
        run: |
          set -euo pipefail
          cat .batch21_part01.txt .batch21_part02.txt .batch21_part03.txt .batch21_part04.txt .batch21_part05.txt .batch21_part06.txt .batch21_part07.txt .batch21_part08.txt .batch21_part09.txt > /tmp/b21.patch.gz.b64
          base64 -d /tmp/b21.patch.gz.b64 > /tmp/b21.patch.gz
          echo '1ed8e9a812f74a94ca696b6f6dadf82a7b4efecba5109942789f36dccbbc7f46  /tmp/b21.patch.gz' | sha256sum -c -
          gzip -dc /tmp/b21.patch.gz > /tmp/b21.patch
          echo '6a03b1586176e9c8f3987497a4ee1fbb6e4db5dd047cfedfbb96304e041e61cf  /tmp/b21.patch' | sha256sum -c -
          git fetch origin main sandbox/context-proposition-batch21-20260912 || git fetch origin main
          test "$(git rev-parse origin/main)" = '1126a833587663beed69e7db604b7d5ad4ad1264'
          git checkout -B sandbox/context-proposition-batch21-20260912 origin/main
          git apply --check /tmp/b21.patch
          git apply /tmp/b21.patch
          git add -A
          test "$(git write-tree)" = '65e032a330c2143b764ddf0a2950661ea69aec2f'
          git config user.name 'がっちむち♂'
          git config user.email 'ohira.teppei@gmail.com'
          git commit -m 'feat: 帰属文脈・場合分け・取得命題を統合（第21バッチ）'
          git push --force-with-lease origin HEAD:refs/heads/sandbox/context-proposition-batch21-20260912
