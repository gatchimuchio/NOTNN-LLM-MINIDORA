name: MINIDORA high-water structure candidate apply

on:
  push:
    branches:
      - audit/revalidate-structure-on-highwater
    paths:
      - .github/workflows/revalidate_structure_candidate_once.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/revalidate-structure-on-highwater
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 履歴確認
        run: |
          git log --oneline --decorate -8
          test "$(git rev-parse 4d34dc2e9901bbe309170d6207446e9aa09dfb08^{tree})" = "762b860997ec1a65b76ada68fe5a1e5748363564"
      - name: GLM基盤を再適用
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick -x \
            b10ee25be355ea0b676f45b443b11f910e0f4579 \
            0631a729072f2c381d3f9e83cb412d0160442b14 \
            48772b222bd9fac943b0fe466caf5fc57a443027 \
            07d241224af863c4897c7359e1c9051b634e8402 \
            5c5c5dcf8d156f70437ea1c1e61ff84490ce781e \
            246153e35be011cfc0493c5b54290d7fd1c3637a \
            16d80ecb9dc5f56936dd5d442add35520e438011
      - name: 統一状態循環を再適用
        run: |
          git cherry-pick -x \
            ff37b9e08f996d580361613595a1b8c6798c4dcd \
            89cfec3c52fce38207e4b970d0d989d0ac7df80a \
            aaee7a23b5c22023827f2eaad9184bc16f72c66d \
            dca3daffedac64e218ee96a3446c3b27f6793941 \
            9edec7063529539b4653140c42c813a65d1030fa \
            998cb138c99db96a45b20e57d7126cf3c56503ec \
            6c67e2d69c05a18bd360c1dee4aa0eb9fe3df89b \
            6b4c27424db667e3841699a9cfb1799625809e1d \
            2ef62f8a25e39875319eb03bf1969408a1838f13
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: 正本検証契約
        run: |
          python tools/repository_consistency_check.py
          python tools/日本語基底監査.py
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -v
          python -m minidora "2+3"
          git diff --check
      - name: 候補枝へ保存
        run: git push origin HEAD:audit/revalidate-structure-on-highwater
