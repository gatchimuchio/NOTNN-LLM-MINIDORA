name: MINIDORA high-water structure candidate apply

on:
  push:
    branches:
      - audit/revalidate-structure-on-highwater
    paths:
      - .github/workflows/revalidate_structure_candidate_once.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/revalidate-structure-on-highwater
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 正本履歴確認
        run: |
          test "$(git rev-parse 4d34dc2e9901bbe309170d6207446e9aa09dfb08^{tree})" = "762b860997ec1a65b76ada68fe5a1e5748363564"
          git merge-base --is-ancestor 4d34dc2e9901bbe309170d6207446e9aa09dfb08 HEAD
          git diff --quiet 4d34dc2e9901bbe309170d6207446e9aa09dfb08 HEAD -- src/minidora tests tools
      - name: GLM基盤を再適用
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git cherry-pick -x \
            b10ee25be355ea0b676f45b443b11f910e0f4579 \
            0631a729072f2c381d3f9e83cb412d0160442b14 \
            48772b222bd9fac943b0fe466caf5fc57a443027 \
            07d241224af863c4897c7359e1c9051b634e8402 \
            5c5c5dcf8d156f70437ea1c1e61ff84490ce781e \
            246153e35be011cfc0493c5b54290d7fd1c3637a \
            16d80ecb9dc5f56936dd5d442add35520e438011
      - name: 統一状態循環本体を再適用
        run: |
          git cherry-pick -x \
            ff37b9e08f996d580361613595a1b8c6798c4dcd \
            89cfec3c52fce38207e4b970d0d989d0ac7df80a \
            aaee7a23b5c22023827f2eaad9184bc16f72c66d \
            dca3daffedac64e218ee96a3446c3b27f6793941 \
            9edec7063529539b4653140c42c813a65d1030fa \
            998cb138c99db96a45b20e57d7126cf3c56503ec \
            6c67e2d69c05a18bd360c1dee4aa0eb9fe3df89b \
            6b4c27424db667e3841699a9cfb1799625809e1d
      - name: 55正本を壊さない単調fallback接続
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/minidora/runtime.py')
          s = p.read_text(encoding='utf-8')
          old = '''                supervised = HDS監督選択実行(
                    hds_ir,
                    tuple(references),
                    コンパイル=self.コンパイル,
                    基礎能力核=self.K3能力核,
                    模型核=self.能力模型核,
                    参照供給器=self.参照供給器,
                    HDS制御=self.HDS監督制御,
                    初期選択=initial,
                )
                return self._HDS選択結果(要求_, hds_ir, supervised.参照, supervised.選択)
          '''
          new = '''                # 55/198を成立させた既存MINIDORA経路を先に最後まで実行する。
                # 既存経路が閉包した場合は一切再解釈せず、その結果をそのまま返す。
                supervised = HDS監督選択実行(
                    hds_ir,
                    tuple(references),
                    コンパイル=self.コンパイル,
                    基礎能力核=self.K3能力核,
                    模型核=self.能力模型核,
                    参照供給器=self.参照供給器,
                    HDS制御=self.HDS監督制御,
                    初期選択=initial,
                )
                if supervised.選択.状態 == "APPROVE" and supervised.選択.回答ラベル is not None:
                    return self._HDS選択結果(要求_, hds_ir, supervised.参照, supervised.選択)

                # 今回追加したK3/GLM/Llama3統一状態循環は、既存経路が未閉包の時だけ
                # fallbackとして発火する。したがって既存の正答経路を置換しない。
                from .hds統一実行 import HDS統一選択評価
                from .hds統一状態循環 import HDS統一状態Session

                fallback_references = tuple(supervised.参照)
                unified_session = HDS統一状態Session(
                    str(hds_ir.正規化文 or hds_ir.原文),
                    fallback_references,
                    主体状態=self.主体状態,
                    認知世界ID=str(hds_ir.認知世界ID or ""),
                )
                unified = HDS統一選択評価(
                    hds_ir,
                    fallback_references,
                    コンパイル=self.コンパイル,
                    模型核=self.能力模型核,
                    統一session=unified_session,
                    主体状態=self.主体状態,
                )
                if unified.状態 == "APPROVE" and unified.回答ラベル is not None:
                    return self._HDS選択結果(要求_, hds_ir, fallback_references, unified)

                # fallbackが閉包できなければ、既存MINIDORAの未閉包結果を保持する。
                return self._HDS選択結果(要求_, hds_ir, supervised.参照, supervised.選択)
          '''
          if s.count(old) != 1:
              raise SystemExit(f'runtime anchor mismatch: {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git add src/minidora/runtime.py
          git commit -m '統一状態循環を55正本の未閉包fallbackとして接続'
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: 基本検証
        run: |
          python tools/repository_consistency_check.py
          python tools/日本語基底監査.py
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -v
          python -m minidora "2+3"
          git diff --check
      - name: 候補枝へ保存
        run: git push origin HEAD:audit/revalidate-structure-on-highwater

  matrix-validate:
    needs: apply-and-validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/revalidate-structure-on-highwater
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: リポジトリ整合性監査
        run: python tools/repository_consistency_check.py
      - name: 日本語基底監査
        run: python tools/日本語基底監査.py
      - name: 構文確認
        run: python -m compileall -q src tests tools
      - name: 単体試験
        run: python -m unittest discover -s tests -v
      - name: module CLI smoke
        run: python -m minidora "2+3"
