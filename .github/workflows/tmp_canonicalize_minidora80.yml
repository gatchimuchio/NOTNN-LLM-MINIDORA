name: TMP canonicalize MINIDORA80

on:
  push:
    branches:
      - canonical/minidora80-module-live-20260909
    paths:
      - .github/workflows/tmp_canonicalize_minidora80.yml

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical/minidora80-module-live-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 正本文書更新
        run: python tools/tmp_canonicalize_minidora80.py
      - name: 正本参照確認
        shell: bash
        run: |
          grep -q 'MINIDORA80' README.md
          grep -q '80 / 198' CURRENT_CANONICAL.md
          grep -q '同じ約40%帯' README.md
          grep -q 'fixed reference Data = forbidden' CURRENT_CANONICAL.md
          python tools/repository_consistency_check.py
          python tools/日本語基底監査.py
      - name: commit and push
        shell: bash
        run: |
          git config user.name 'gatchimuchio'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs: MINIDORA80をModule込みシステム正本へ固定'
          git push origin HEAD:canonical/minidora80-module-live-20260909
