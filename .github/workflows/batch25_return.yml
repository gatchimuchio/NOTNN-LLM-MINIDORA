name: 第25バッチ差分還元
on:
  push:
    branches: [work/batch25-semantic-return-20260913]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 搬送照合と差分適用
        shell: bash
        run: |
          set -euo pipefail
          BASE=4820c3e2663bd6ff6fa73fc39642a36d805d3f76
          git diff --quiet "$BASE" -- . ':(exclude).return/b25/**' ':(exclude).github/workflows/batch25_return.yml'
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          names=['00','01','02','03','04','04b','05','05b','06','06b','07']
          folder=Path('.return/b25')
          assert sorted(p.stem for p in folder.glob('*.b64')) == sorted(names)
          raw=''.join((folder/(n+'.b64')).read_text(encoding='ascii') for n in names)
          compressed=base64.b64decode(raw,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='cbfe0f736587946fde831453531075c847696235150136af99192520885837e5', '圧縮差分不一致'
          patch=gzip.decompress(compressed)
          assert len(patch)==109966
          assert hashlib.sha256(patch).hexdigest()=='cc663a1b743be8d0e79c344f9dc0e4f63f36c4205069554b56436fda47e6ee9a', '実装差分不一致'
          Path('/tmp/batch25.patch').write_bytes(patch)
          print('搬送原本照合 PASS',len(patch))
          PY
          git apply --check /tmp/batch25.patch
          git apply /tmp/batch25.patch
          rm -rf .return/b25
          rm .github/workflows/batch25_return.yml
          git add -A
          python - <<'PY'
          import subprocess
          expected={
            'docs/性能改善台帳_20260913.json':'c3c3e81c9b531cacde8fe82cd6c9634cf07538ef',
            'docs/第25バッチ_意味接続と探索削減.md':'c7f31668d3ab43ae9ed7a315955af29b63a28b13',
            'src/minidora/依頼表層.py':'0ea644d595b4d887192039ca82743eba7b3bc61d',
            'src/minidora/文脈命題.py':'0b86b0761a325f190a8a1319b8f053ce2dc7b411',
            'src/minidora/明示別名.py':'dd36873d1511aeb71f914aef3862fa4e71fc3bc1',
            'src/minidora/有限仮説探索.py':'e5f50ef7403977055015d9497bbdb4e20d5518fe',
            'src/minidora/汎用会話.py':'becea289b1b118e9994ff9c273871a3504498cf0',
            'src/minidora/監査改善会話.py':'4b92fda34a36883306484c825bd0ba0b48cc2997',
            'src/minidora/監査改善会話解釈.py':'2dd1b4b74ba450fbdbf23486e7614ce7a29a31b9',
            'src/minidora/監査改善接続.py':'77e1ba8fef5cde20f7ad0b0eda2a62cafe6617b7',
            'src/minidora/製品版/製品チャット.py':'563dbee5372429b44eb8ad18bfe99ca25b0de1aa',
            'tests/test_改善会話.py':'098ea82957901b4fdce31355bd0caf6b7df44138',
            'tests/test_第25仮説規模.py':'d45fdbd63729fe6784d18ca08fadb62ccc99974e',
            'tests/test_第25意味接続.py':'ceeab63406c4bfc6c8a367d09d6103d5663ef3ba',
            'tests/test_第25製品接続.py':'c33295dd4ee411d2966950d8cc74254135e4704f',
            'tools/監査改善チャット.py':'417cb8257886f3fdf2c4f601c749f9ec9af207c0'}
          base='4820c3e2663bd6ff6fa73fc39642a36d805d3f76'
          actual=subprocess.check_output(['git','diff','--cached','--name-only','-z',base]).decode().strip('\0').split('\0')
          assert set(actual)==set(expected),actual
          for p,h in expected.items():
              assert subprocess.check_output(['git','hash-object',p]).decode().strip()==h,p
          print('最終16ファイル全数照合 PASS')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: 第25バッチの意味接続と有限仮説探索改善'
          git archive --format=zip -o "$RUNNER_TEMP/batch25-full-source.zip" HEAD
          git rev-parse HEAD HEAD^{tree}
          git push origin HEAD:work/batch25-semantic-return-20260913
      - name: 完全構成の検証用固定取得物
        uses: actions/upload-artifact@v4
        with:
          name: batch25-full-source
          path: ${{ runner.temp }}/batch25-full-source.zip
          retention-days: 7
