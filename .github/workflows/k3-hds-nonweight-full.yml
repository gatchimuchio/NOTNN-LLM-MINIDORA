name: K3 HDS Nonweight Full Compile

on:
  push:
    branches:
      - chappie/k3-hds-stream-v6
    paths:
      - tools/k3_hds_nonweight_compile.py
      - .github/workflows/k3-hds-nonweight-full.yml

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/k3-hds-stream-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Compile all 18 nonweight public artifacts
        run: |
          mkdir -p out
          python tools/k3_hds_nonweight_compile.py \
            --inventory '解析/K3全公開データコンパイル/v6/mother-set/public-artifact-inventory.json' \
            --out out/nonweight-HDS-日本語意味構文.jsonl.gz \
            --audit out/nonweight-full-audit.json
      - name: Upload complete nonweight corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k3-hds-nonweight-full
          path: out/
          retention-days: 30
          compression-level: 0
      - name: Persist corpus and audit
        if: success()
        run: |
          dest='解析/K3全公開データコンパイル/v6/nonweight-full'
          mkdir -p "$dest"
          cp out/nonweight-full-audit.json "$dest/"
          cp out/nonweight-HDS-日本語意味構文.jsonl.gz "$dest/"
          git config user.name 'k3-hds-stream-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$dest"
          git commit -m 'K3非weight 18 artifact全byte HDS日本語コンパイルを保存'
          git push origin HEAD:chappie/k3-hds-stream-v6
