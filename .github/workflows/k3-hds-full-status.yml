name: K3 HDS Full Compile Status Snapshot
# snapshot-generation: 5

on:
  push:
    branches:
      - chappie/k3-hds-stream-v6
    paths:
      - .github/workflows/k3-hds-full-status.yml

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/k3-hds-stream-v6
      - name: Query recent full payload runs and jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' \
            "${api}/actions/workflows/k3-hds-full-payload.yml/runs?branch=chappie%2Fk3-hds-stream-v6&per_page=10" > out/runs.json
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          runs=json.loads(Path('out/runs.json').read_text())['workflow_runs']
          runs=sorted(runs,key=lambda x:x['created_at'],reverse=True)[:3]
          token=os.environ['GH_TOKEN']; api=os.environ['GITHUB_API_URL']; repo=os.environ['GITHUB_REPOSITORY']
          out=[]
          for r in runs:
              req=urllib.request.Request(f"{api}/repos/{repo}/actions/runs/{r['id']}/jobs?per_page=100",headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as f: jobs=json.load(f)['jobs']
              def c(field,val): return sum(1 for j in jobs if j.get(field)==val)
              out.append({'id':r['id'],'status':r['status'],'conclusion':r.get('conclusion'),'created_at':r['created_at'],'updated_at':r['updated_at'],'head_sha':r['head_sha'],'html_url':r['html_url'],'jobs':{'count':len(jobs),'queued':c('status','queued'),'in_progress':c('status','in_progress'),'completed':c('status','completed'),'success':c('conclusion','success'),'failure':c('conclusion','failure'),'cancelled':c('conclusion','cancelled')}})
          Path('out/full-status.json').write_text(json.dumps({'runs':out},ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'runs':out},ensure_ascii=False,indent=2))
          PY
      - name: Persist snapshot
        run: |
          dest='解析/K3全公開データコンパイル/v6/full-weight/status'
          mkdir -p "$dest"
          cp out/full-status.json "$dest/latest.json"
          git config user.name 'k3-hds-stream-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "$dest/latest.json"
          git commit -m 'K3全payload直近run状況を保存' || true
          git push origin HEAD:chappie/k3-hds-stream-v6
