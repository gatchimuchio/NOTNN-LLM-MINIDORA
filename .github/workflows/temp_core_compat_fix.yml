name: TEMP core compatibility repair

on:
  push:
    paths:
      - '.github/workflows/temp_core_compat_fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited compatibility repair
        run: python tools/temp_apply_core_compat.py
      - name: Targeted regression tests
        run: |
          python -m unittest discover -s tests -p 'test_汎用core改善.py' -v
          python -m unittest discover -s tests -p 'test_能力状態差循環_v1.py' -v
      - name: Commit repair
        run: |
          git config user.name 'gatchimuchio'
          git config user.email 'ohira.teppei@gmail.com'
          git add src/minidora/模型.py src/minidora/能力状態差循環.py
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve anchorless state-delta contracts'
          git push origin HEAD:main
