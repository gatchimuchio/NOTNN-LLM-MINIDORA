name: Apply MINIDORA unified reduction

on:
  push:
    paths:
      - ".github/workflows/apply_minidora_unified_reduction.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply sandbox-validated patches
        run: python tools/構文化統一状態循環_適用.py
      - name: Remove one-time apply script
        run: git rm tools/構文化統一状態循環_適用.py
      - name: Install
        run: python -m pip install -e .
      - name: Repository consistency
        run: python tools/repository_consistency_check.py
      - name: Japanese-base audit
        run: python tools/日本語基底監査.py
      - name: Compile
        run: python -m compileall -q src tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Legacy scale regression
        run: python tools/規模測定.py
      - name: Module CLI smoke
        run: python -m minidora "2+3"
      - name: Console CLI smoke
        run: minidora "2+3"
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "がっちむち♂"
          git config user.email "ohira.teppei@gmail.com"
          git add src/minidora/runtime.py src/minidora/hds監督選択runtime.py src/minidora/hds能力経路_v2.py src/minidora/hds候補提案runtime.py
          git diff --cached --check
          git commit -m "構文化成果を標準MINIDORA状態循環へ接続"
          git push origin HEAD:main
