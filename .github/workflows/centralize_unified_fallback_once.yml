name: MINIDORA centralize unified fallback one-shot

on:
  push:
    branches:
      - audit/revalidate-structure-on-highwater
    paths:
      - .github/workflows/centralize_unified_fallback_once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/revalidate-structure-on-highwater
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 製品経路一本化
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/scripts/centralize_unified_fallback.py
          git add src/minidora/runtime.py src/minidora/hds監督選択runtime.py
          git diff --cached --check
          git commit -m '統一状態fallbackを製品HDS監督経路へ一本化'
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: 検証
        run: |
          python tools/repository_consistency_check.py
          python tools/日本語基底監査.py
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -v
          python -m minidora "2+3"
      - name: 候補枝へ保存
        run: git push origin HEAD:audit/revalidate-structure-on-highwater
