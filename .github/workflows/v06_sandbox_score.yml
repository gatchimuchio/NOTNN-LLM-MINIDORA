name: MINIDORA v0.6 sandbox same-reference GPQA A/B

on:
  push:
    branches:
      - sandbox/v0.6-score-20260906
    paths:
      - tools/v06_unified_same_reference_ab.py
      - .github/workflows/v06_sandbox_score.yml

permissions:
  contents: read

concurrency:
  group: v06-sandbox-score-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      MINIDORA_V06_AB_OUT: v06_unified_same_reference_ab.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: 評価器構文確認
        run: python -m py_compile tools/v06_unified_same_reference_ab.py
      - name: GPQA Diamond 198問 same-Reference paired A/B
        run: python tools/v06_unified_same_reference_ab.py
      - name: 結果要約
        if: always()
        run: |
          if [ -f v06_unified_same_reference_ab.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('v06_unified_same_reference_ab.json').read_text(encoding='utf-8'))
          print(json.dumps(data['protocol'], ensure_ascii=False, indent=2))
          print(json.dumps(data['current_main'], ensure_ascii=False, indent=2))
          print(json.dumps(data['v06_unified'], ensure_ascii=False, indent=2))
          print(json.dumps(data['delta_v06_minus_current'], ensure_ascii=False, indent=2))
          print(json.dumps(data['retrieval'], ensure_ascii=False, indent=2))
          PY
          fi
      - name: 測定成果を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minidora-v06-sandbox-gpqa-ab
          path: v06_unified_same_reference_ab.json
          if-no-files-found: warn
