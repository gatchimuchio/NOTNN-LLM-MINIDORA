name: PR整理・前方移植・一時実行

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/PR整理_前方移植_一時実行.yml"

permissions:
  contents: write

jobs:
  forward_port:
    name: 前方移植
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 最新mainへ前方移植
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "minidora-cleanup"
          git config user.email "actions@users.noreply.github.com"
          git config core.quotepath false
          git fetch origin main "sandbox/hds-v7-source-identity-20260919"
          test "$(git rev-parse origin/sandbox/hds-v7-source-identity-20260919)" = "1b3b6140604dc2fde4cb5b86aefcb31c3b7fa7f4"
          git switch -C "sandbox/hds-v7-source-identity-20260919" origin/main
          if ! git cherry-pick "1b3b6140604dc2fde4cb5b86aefcb31c3b7fa7f4"; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = "HDS_MINIDORA_現行正本.md" ]; then
              git checkout --ours -- "HDS_MINIDORA_現行正本.md"
              git add "HDS_MINIDORA_現行正本.md"
              git cherry-pick --continue
            else
              printf '未解決競合:\n'
              printf '%s\n' "${conflicts[@]}"
              exit 1
            fi
          fi

      - name: 基本監査
        shell: bash
        run: |
          set -euo pipefail
          python tools/リポジトリ整合性監査.py
          python tools/日本語基底監査.py
          python tools/日本語基底詳細監査.py
          python tools/公開境界監査.py
          python -m compileall -q src tests tools

      - name: 全単体試験
        shell: bash
        run: python -m unittest discover -s tests -q

      - name: 前方移植済みブランチを更新
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease=refs/heads/sandbox/hds-v7-source-identity-20260919:1b3b6140604dc2fde4cb5b86aefcb31c3b7fa7f4 origin HEAD:refs/heads/sandbox/hds-v7-source-identity-20260919
          echo "NEW_HEAD=$(git rev-parse HEAD)"
