name: MINIDORA rev5 候補還元

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/候補還元.yml"

permissions:
  contents: write

concurrency:
  group: minidora-rev5-return
  cancel-in-progress: false

jobs:
  return_verify:
    name: 候補適用・全体検証・還元
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 検証済み候補差分を取得
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB: a391229f24ee9da06df9be12672c8026eca58d80
          PATCH_SHA256: e944ae8790924dee577c21e1287ddd9d96b6f4334b4284c36cd55b35e3237a47
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          sha=os.environ["PATCH_BLOB"]
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
              headers={
                  "Authorization": "Bearer "+os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as res:
              data=json.load(res)
          raw=base64.b64decode(data["content"])
          patch=gzip.decompress(raw)
          actual=hashlib.sha256(patch).hexdigest()
          expected=os.environ["PATCH_SHA256"]
          if actual != expected:
              raise SystemExit(f"候補差分SHA不一致: {actual} != {expected}")
          pathlib.Path("/tmp/minidora_rev5.patch").write_bytes(patch)
          print("候補差分SHA256:", actual)
          PY

      - name: 候補差分を適用
        run: |
          git apply --check -p1 /tmp/minidora_rev5.patch
          git apply -p1 /tmp/minidora_rev5.patch
          rm .github/workflows/候補還元.yml
          git diff --check

      - name: パッケージ導入
        run: python -m pip install -e .

      - name: 正本監査
        run: |
          python tools/リポジトリ整合性監査.py
          python tools/日本語基底監査.py
          python tools/日本語基底詳細監査.py
          python tools/公開境界監査.py
          python -m compileall -q src tests tools

      - name: 全試験
        run: python -m unittest discover -s tests -q

      - name: 変更を還元
        run: |
          git config user.name "MINIDORA verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "還元差分なし"
            exit 1
          fi
          git commit -m "九座標27面の目的駆動関係操作を統合"
          git push origin HEAD:main
