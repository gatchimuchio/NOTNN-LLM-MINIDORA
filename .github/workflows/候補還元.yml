name: MINIDORA rev5 候補還元
# retrigger: 2026-10-04 final-local-green

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/候補還元.yml"

permissions:
  contents: write

concurrency:
  group: minidora-rev5-return
  cancel-in-progress: false

jobs:
  return_verify:
    name: 候補適用・全体検証・還元
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 候補差分を取得・適用
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB: a391229f24ee9da06df9be12672c8026eca58d80
          PATCH_SHA256: e944ae8790924dee577c21e1287ddd9d96b6f4334b4284c36cd55b35e3237a47
          FINAL_FIX_BLOB: 9f200d4efe92f49aa4a4d479e754fbe9effb3bc3
          FINAL_FIX_SHA256: 2bbca7d4f4e213c97c897b581e0e3c066f2fc539315b2b9977170705266e7118
          OVERLAY_JSON: '{"src/minidora/コア/座標展開.py":"c1fba058d00bb48ce0af53c7c77c15077522e22d","src/minidora/統合駆動_v2/座標接続.py":"bc9b522cda749bbbdc59e9f2417973d225cfb003","src/minidora/統合駆動_v2/座標帰還.py":"3c1bc4b19af121301dd5c7ec8fc5c8b1722324b6","src/minidora/駆動系/目的不足.py":"4a2dbdfb0f132e5a3e84d927f51a4a1b2c553d50","src/minidora/駆動系/目的循環.py":"8e80a47006c66888853badcfb77455c6dbbdef78","src/minidora/駆動系/選択関係.py":"5f2c94bf46751053973e2fec42f90199f76477de","src/minidora/入力系/不足観測.py":"bc86821ec60765070c6a86b2346a4985b8808590","src/minidora/参照.py":"6abe3ebc45bcaa837a6a11237de1436bd18bf449","src/minidora/HDS選択継承循環.py":"0044b1b7530564e25911eb310b333862bb077ee0","src/minidora/HDS駆動コア.py":"98c6295e41d7d4d7d70480423cea5606aef85eb6","src/minidora/コア/構文化再利用.py":"eef9342e598843623d6610a6052330006b121dc2","src/minidora/コア/継続保存.py":"b4428f5dbad480b87d551c9961193b5c5c335d13","src/minidora/HDS実行主体.py":"92f14110c9adb1646e90b8d7616d106d79752fd9","src/minidora/統合駆動_v2/計画.py":"a8df60b1b7ef3c90dcf619fd6fa6630d294ddbe4","src/minidora/駆動系/取得.py":"de785d331f69c844d47a6e3e29e7adc395f676b4","src/minidora/駆動系/変換.py":"a2aa9e0a7f922b203121e43886e3e58cf629cabc","src/minidora/統合駆動_v2/状態更新.py":"08f0cab284d29c7cfdc2426cb39d4af3c9e7662c","src/minidora/統合駆動_v2/保存.py":"df604a1a805b3de0f211f6188a387a857dad6532","src/minidora/統合駆動_v2/循環.py":"78fdb62a4071c142f33f8d16f9e0d9be0f5d598d","src/minidora/駆動系/接続.py":"30e4ee3720d65f76dc4b3f551d96e626c835ae61","src/minidora/駆動系/学習.py":"43ae58d67eb9d1b028b9d4b674e479e3929fb0f3","src/minidora/統合駆動_v2/適応記憶.py":"00b7c5aa660c89ac9e10df5cebf7c86de1b544bf","src/minidora/統合駆動_v2/自動形成.py":"93bcf1d0c9dd850e732321a09a1d5736c799b933","src/minidora/HDS構文化失敗.py":"649840eb9bce1d19bc9ccae8b3091a8698ff62de","tests/test_GPQA並列集計.py":"febe1480633e8ea772feef9ea61089336d4a476d","tests/test_GPQA実測管理.py":"2f1f8a8d560770e2bcc3af3eb7147c3dc780f807","現行正本.md":"a349bde43d2f95fd328de97acd01fab6547df092"}'
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          def api(url):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=30) as res:return json.load(res)
          data=api(f"https://api.github.com/repos/{repo}/git/blobs/{os.environ['PATCH_BLOB']}")
          raw=base64.b64decode(data["content"]);patch=gzip.decompress(raw)
          actual=hashlib.sha256(patch).hexdigest()
          if actual!=os.environ["PATCH_SHA256"]:raise SystemExit("候補差分SHA不一致")
          pathlib.Path("/tmp/minidora_rev5.patch").write_bytes(patch)
          PY
          git apply --check -p1 /tmp/minidora_rev5.patch
          git apply -p1 /tmp/minidora_rev5.patch
          python - <<'PY'
          import base64,json,os,pathlib,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"];token=os.environ["GH_TOKEN"]
          overlays=json.loads(os.environ["OVERLAY_JSON"])
          for path,sha in overlays.items():
              req=urllib.request.Request(f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=30) as res:data=json.load(res)
              content=base64.b64decode(data["content"])
              target=pathlib.Path(path);target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(content)
          PY
          python - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,urllib.request
          repo=os.environ["GITHUB_REPOSITORY"];token=os.environ["GH_TOKEN"]
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/git/blobs/{os.environ['FINAL_FIX_BLOB']}",
              headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=30) as res:data=json.load(res)
          patch=gzip.decompress(base64.b64decode(data["content"]))
          actual=hashlib.sha256(patch).hexdigest()
          if actual!=os.environ["FINAL_FIX_SHA256"]:raise SystemExit("最終追補差分SHA不一致")
          pathlib.Path("/tmp/minidora_rev5_final_fix.patch").write_bytes(patch)
          PY
          git apply --check /tmp/minidora_rev5_final_fix.patch
          git apply /tmp/minidora_rev5_final_fix.patch
          rm -f src/minidora/構文化再利用.py src/minidora/継続保存.py
          rm .github/workflows/候補還元.yml
          git diff --check

      - name: 候補適用後ソースを保存
        uses: actions/upload-artifact@v4
        with:
          name: minidora-rev5-candidate-source
          path: |
            src
            tests
            tools
            現行正本.md
          if-no-files-found: error

      - name: パッケージ導入
        run: python -m pip install -e .

      - name: 正本監査
        run: |
          python tools/リポジトリ整合性監査.py
          python tools/日本語基底監査.py
          python tools/日本語基底詳細監査.py
          python tools/公開境界監査.py
          python -m compileall -q src tests tools

      - name: 前回失敗系統の集中回帰
        run: |
          python -m unittest -q \
            tests.test_HDSコア入力優先_v1 \
            tests.test_HDS実行主体_v1 \
            tests.test_HDS内包統合_v2 \
            tests.test_HDS内包統合_v2追加 \
            tests.test_HDS学習機械循環_v2 \
            tests.test_HDS正本継承循環_v1 \
            tests.test_HDS配線境界_v3 \
            tests.test_参照_並列 \
            tests.test_実行系_HDS_v1 \
            tests.test_目的駆動198連続
          python -m unittest discover -s tests/目的関係統合_v3 -q

      - name: 候補デバッグ資料
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minidora-rev5-candidate-debug
          path: |
            tests/目的関係統合_v3
            src/minidora/入力系/選択契約.py
            src/minidora/駆動系/目的不足.py
            src/minidora/駆動系/目的循環.py
            src/minidora/統合駆動_v2/座標接続.py
          if-no-files-found: warn

      - name: 全試験
        run: python -m unittest discover -s tests -q

      - name: 変更を還元
        run: |
          git config user.name "MINIDORA verification"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "還元差分なし"; exit 1; fi
          git commit -m "九座標27面の目的駆動関係操作を統合"
          git push origin HEAD:main
