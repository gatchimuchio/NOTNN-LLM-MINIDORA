name: MINIDORA R品質 一時受入 v9

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/一時_R品質受入.yml"

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: 日本語基底監査
        run: |
          python tools/日本語基底監査.py
          python tools/日本語基底詳細監査.py
      - name: R品質局所回帰
        run: |
          python -m unittest -v \
            tests.test_EuropePMC参照 \
            tests.test_Europe_PMC参照_参照 \
            tests.test_Crossref参照 \
            tests.test_HTTP参照 \
            tests.test_参照_並列 \
            tests.test_HDS能力経路_v2 \
            tests.test_HDS_参照観測要求 \
            tests.test_HDS正本継承循環_v1 \
            tests.test_HDS実行内学習循環_v1 \
            tests.test_実行系_HDS_v1
