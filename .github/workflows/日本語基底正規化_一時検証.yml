name: 日本語基底正規化 一時検証

on:
  push:
    branches: [main]
  pull_request_target:
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: 日本語基底検証-pr115
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.number == 115 &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'chore/japanese-base-normalization-2026-09-15')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/japanese-base-normalization-2026-09-15
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: 日本語基底全数監査
        run: python tools/日本語基底監査.py
      - name: リポジトリ整合性監査
        run: python tools/repository_consistency_check.py
      - name: 構文確認
        run: python -m compileall -q src tests tools
      - name: 全単体試験
        run: python -m unittest discover -s tests -v
      - name: 規模測定回帰
        run: python tools/規模測定.py
      - name: コマンドライン確認
        run: |
          python -m minidora "2+3"
          minidora "2+3"
      - name: 全tree成果物作成
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.')
          with zipfile.ZipFile('日本語基底正規化_head.zip', 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  rel = p.as_posix()
                  if rel.startswith('.git/') or rel == '日本語基底正規化_head.zip':
                      continue
                  zf.write(p, rel)
          PY
      - name: 全tree成果物保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 日本語基底正規化-head
          path: 日本語基底正規化_head.zip
