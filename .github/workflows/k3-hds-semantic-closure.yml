name: K3 HDS Semantic Closure

on:
  push:
    branches:
      - chappie/k3-hds-stream-v6
    paths:
      - tools/k3_hds_semantics_v6.py
      - tools/k3_hds_semantic_closure.py
      - .github/workflows/k3-hds-semantic-closure.yml

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/k3-hds-stream-v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy requests
      - name: Audit HDS principle closure
        run: python tools/k3_hds_semantic_closure.py
      - name: Persist closure audit
        if: success()
        run: |
          git config user.name 'k3-hds-stream-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add '解析/K3全公開データコンパイル/v6/header-probe/HDS原理族閉包監査.json'
          git commit -m 'K3 HDS原理族全tensor閉包監査を保存'
          git push origin HEAD:chappie/k3-hds-stream-v6
