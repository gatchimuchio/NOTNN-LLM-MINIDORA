name: HDS全体運用v1 還元

on:
  push:
    branches:
      - sandbox/hds-operation-v1-20260918

permissions:
  contents: write

jobs:
  apply-audit-commit:
    if: github.event.head_commit.message == 'HDS全体運用v1 還元ブートストラップ'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 基点を検証
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4067f2ee32efb5d4f3f091095e1fa61412ea0792"

      - name: 監査済みパッチを復元
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk_* | tr -d '\n' | base64 -d > /tmp/HDS_OPERATION_V1.patch.xz
          echo 'ebcdb12f39aec7d9e7c92fcf3d144a27ff35dd2e722c16906ecbc5a3b31e8671  /tmp/HDS_OPERATION_V1.patch.xz' | sha256sum -c -
          xz -dc /tmp/HDS_OPERATION_V1.patch.xz > /tmp/HDS_OPERATION_V1.patch
          echo '50cc0355f6a9e382319d945826b754c81dbe5bffb6abbcba7a5aceac6a98f2d5  /tmp/HDS_OPERATION_V1.patch' | sha256sum -c -
          git apply --check /tmp/HDS_OPERATION_V1.patch
          git apply /tmp/HDS_OPERATION_V1.patch

      - name: 一時資材を除去し期待treeを照合
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f '.github/workflows/HDS全体運用還元.yml'
          git add -A
          actual="$(git write-tree)"
          echo "actual_tree=$actual"
          test "$actual" = "13e81bf1a9c4b42ea3159da4bc798d5a9827e02a"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: パッケージ導入
        run: python -m pip install -e .

      - name: 整合性監査と構文確認
        shell: bash
        run: |
          set -euo pipefail
          python tools/リポジトリ整合性監査.py
          python tools/日本語基底監査.py
          python tools/日本語基底詳細監査.py
          python -m compileall -q src tests tools

      - name: HDS全体運用 新規試験
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_HDS全体運用_*.py' -v

      - name: 全体回帰
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -q

      - name: 監査済み差分を確定コミットしてpush
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "13e81bf1a9c4b42ea3159da4bc798d5a9827e02a"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'HDS-MINIDORA全体運用v1を還元'
          git push origin HEAD:sandbox/hds-operation-v1-20260918
