name: Archive K3 HDS v6 Corpus Permanently

on:
  push:
    branches: [chappie/k3-hds-stream-v6]
    paths:
      - .github/workflows/k3-hds-v6-archive-release.yml

permissions:
  actions: read
  contents: write

concurrency:
  group: k3-hds-v6-permanent-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_ARTIFACT_ID: '9369762013'
      SOURCE_FINAL_BRANCH: 'chappie/k3-hds-final-v6'
      RELEASE_TAG: 'k3-hds-v6.0-c5d1dd4'
      ARCHIVE_DIR: 'artifacts/k3-hds/v6.0'
      ZIP_NAME: 'K3_HDS日本語全公開データコンパイル_v6_0.zip'
      SHA_NAME: 'K3_HDS日本語全公開データコンパイル_v6_0.zip.sha256'
      EXPECTED_ZIP_SHA256: '0473757f3d1de7bee7798b81e43356a9c245422bf8a3afaba3178c20ea997fab'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappie/k3-hds-stream-v6
          fetch-depth: 1

      - name: Fetch pinned corpus metadata
        run: |
          git fetch origin "${SOURCE_FINAL_BRANCH}:refs/remotes/origin/${SOURCE_FINAL_BRANCH}"
          mkdir -p /tmp/k3-final-meta
          git show "origin/${SOURCE_FINAL_BRANCH}:audit.json" > /tmp/k3-final-meta/audit.json
          git show "origin/${SOURCE_FINAL_BRANCH}:mother-set.json" > /tmp/k3-final-meta/mother-set.json
          git show "origin/${SOURCE_FINAL_BRANCH}:README.md" > /tmp/k3-final-meta/README.original.md
          git show "origin/${SOURCE_FINAL_BRANCH}:archive.sha256" > /tmp/k3-final-meta/archive.sha256

      - name: Download exact completed corpus artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/k3-artifact
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o /tmp/k3-artifact/outer.zip
          unzip -q /tmp/k3-artifact/outer.zip -d /tmp/k3-artifact/extracted
          test -f "/tmp/k3-artifact/extracted/${ZIP_NAME}"
          test -f "/tmp/k3-artifact/extracted/${SHA_NAME}"
          actual=$(sha256sum "/tmp/k3-artifact/extracted/${ZIP_NAME}" | awk '{print $1}')
          test "${actual}" = "${EXPECTED_ZIP_SHA256}"
          sidecar=$(awk '{print $1}' "/tmp/k3-artifact/extracted/${SHA_NAME}")
          test "${sidecar}" = "${EXPECTED_ZIP_SHA256}"
          unzip -tq "/tmp/k3-artifact/extracted/${ZIP_NAME}" >/dev/null
          echo "ZIP_SHA256=${actual}" >> "$GITHUB_ENV"

      - name: Commit permanent archive index to main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p "${ARCHIVE_DIR}"
          cp /tmp/k3-final-meta/audit.json "${ARCHIVE_DIR}/audit.json"
          cp /tmp/k3-final-meta/mother-set.json "${ARCHIVE_DIR}/mother-set.json"
          cp /tmp/k3-final-meta/archive.sha256 "${ARCHIVE_DIR}/${SHA_NAME}"
          cat > "${ARCHIVE_DIR}/README.md" <<'EOF'
          # K3 HDS日本語全公開データコンパイル v6.0 — 固定スナップショット保存

          このディレクトリは、ミニドラ開発用に実施したK3 HDS日本語コンパイル成果 v6.0 の恒久アーカイブ台帳である。

          ## 完了済み範囲

          - HF: `moonshotai/Kimi-K3`
          - 固定revision: `c5d1dd4c428bd1ce8b88c5044f3b6ccde9e3b721`
          - HF files: 114
          - 公式GitHub/Tech Blog等を加えた公開source item: 126 / 126
          - 公開source byte: 1,561,002,449,957 / 1,561,002,449,957
          - weight shard: 96 / 96
          - tensor: 497,220 / 497,220
          - tensor HDS日本語意味構文: 497,220 / 497,220
          - 未処理item: 0
          - 未処理byte: 0
          - weight identity mismatch: 0
          - 当該固定母集合の最終判定: PASS

          ## 重要な境界

          これは上記HF revisionを固定母集合とした完全成果であり、Hugging Faceの可変`main`を永久に代表するものではない。
          v6.0作成後にHF側へ追加されたcommit・評価資料等は、このv6.0には含まれない。
          したがって名称上の「全公開データ」は**固定した母集合に対する全数完遂**を意味する。

          ## 成果物

          大容量の正本ZIPはgit履歴へ直置きせず、同一GitHubリポジトリのRelease
          `k3-hds-v6.0-c5d1dd4` に恒久保存する。

          - `audit.json`: 最終全数監査
          - `mother-set.json`: 母集合正本
          - `K3_HDS日本語全公開データコンパイル_v6_0.zip.sha256`: 正本ZIP SHA-256
          - Release asset `K3_HDS日本語全公開データコンパイル_v6_0.zip`: HDS日本語意味構文を含む成果正本

          ZIP SHA-256:
          `0473757f3d1de7bee7798b81e43356a9c245422bf8a3afaba3178c20ea997fab`
          EOF
          cat > "${ARCHIVE_DIR}/release.json" <<EOF
          {
            "release_tag": "${RELEASE_TAG}",
            "asset": "${ZIP_NAME}",
            "sha256": "${EXPECTED_ZIP_SHA256}",
            "scope": "HF pinned revision c5d1dd4c428bd1ce8b88c5044f3b6ccde9e3b721 + pinned official GitHub/Tech Blog sources",
            "live_hf_main_complete": false,
            "pinned_mother_set_complete": true
          }
          EOF
          git config user.name 'k3-hds-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "${ARCHIVE_DIR}"
          if git diff --cached --quiet; then
            echo 'Archive index already current.'
          else
            git commit -m 'Archive K3 HDS v6 corpus snapshot'
            git push origin main
          fi
          echo "ARCHIVE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Create or refresh permanent GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.error, urllib.parse, urllib.request

          api=os.environ['GITHUB_API_URL']
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          tag=os.environ['RELEASE_TAG']
          target=os.environ['ARCHIVE_COMMIT']
          zip_name=os.environ['ZIP_NAME']
          sha_name=os.environ['SHA_NAME']
          expected_sha=os.environ['EXPECTED_ZIP_SHA256']
          root=pathlib.Path('/tmp/k3-artifact/extracted')
          headers={
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'k3-hds-v6-archive-bot/1',
          }

          def request_json(method, url, payload=None, allow_404=False):
              data=None
              h=dict(headers)
              if payload is not None:
                  data=json.dumps(payload, ensure_ascii=False).encode('utf-8')
                  h['Content-Type']='application/json'
              req=urllib.request.Request(url, data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=120) as f:
                      raw=f.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  if allow_404 and e.code==404:
                      return None
                  raise

          release=request_json('GET', f'{api}/repos/{repo}/releases/tags/{urllib.parse.quote(tag)}', allow_404=True)
          body=(
              'K3 HDS日本語全公開データコンパイル v6.0 の固定スナップショット成果。\n\n'
              '- HF revision: c5d1dd4c428bd1ce8b88c5044f3b6ccde9e3b721\n'
              '- 公開source item: 126/126\n'
              '- 公開source byte: 1,561,002,449,957/1,561,002,449,957\n'
              '- weight shard: 96/96\n'
              '- tensor/HDS日本語意味構文: 497,220/497,220\n'
              '- unprocessed item/byte: 0/0\n'
              f'- ZIP SHA-256: {expected_sha}\n\n'
              '注意: これは上記固定revisionに対する完全成果であり、後続commitを含む可変HF mainの最新版全体ではない。'
          )
          if release is None:
              release=request_json('POST', f'{api}/repos/{repo}/releases', {
                  'tag_name': tag,
                  'target_commitish': target,
                  'name': 'K3 HDS日本語全公開データコンパイル v6.0 — pinned snapshot',
                  'body': body,
                  'draft': False,
                  'prerelease': False,
              })
          else:
              release=request_json('PATCH', f"{api}/repos/{repo}/releases/{release['id']}", {
                  'target_commitish': target,
                  'name': 'K3 HDS日本語全公開データコンパイル v6.0 — pinned snapshot',
                  'body': body,
                  'draft': False,
                  'prerelease': False,
              })

          assets={a['name']:a for a in release.get('assets',[])}
          for name in (zip_name, sha_name):
              if name in assets:
                  request_json('DELETE', f"{api}/repos/{repo}/releases/assets/{assets[name]['id']}")

          upload_base=release['upload_url'].split('{',1)[0]
          uploaded=[]
          for name, ctype in ((zip_name,'application/zip'),(sha_name,'text/plain; charset=utf-8')):
              p=root/name
              url=upload_base+'?'+urllib.parse.urlencode({'name':name})
              data=p.read_bytes()
              h=dict(headers)
              h['Content-Type']=ctype
              h['Content-Length']=str(len(data))
              req=urllib.request.Request(url,data=data,headers=h,method='POST')
              with urllib.request.urlopen(req,timeout=900) as f:
                  uploaded.append(json.load(f))

          result={
              'release_id': release['id'],
              'tag': tag,
              'target_commit': target,
              'html_url': release['html_url'],
              'assets': [
                  {'name':a['name'],'size':a['size'],'digest':a.get('digest'),'browser_download_url':a['browser_download_url']}
                  for a in uploaded
              ],
              'expected_zip_sha256': expected_sha,
          }
          pathlib.Path('/tmp/k3-release-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY

      - name: Publish archive result for verification
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/k3-release-result.json "${ARCHIVE_DIR}/release-result.json"
          git add "${ARCHIVE_DIR}/release-result.json"
          git config user.name 'k3-hds-archive-bot'
          git config user.email 'actions@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Record K3 HDS v6 archive release'
            git push origin main
          fi

      - name: Verify repository archive files
        run: |
          git fetch origin main
          git show "origin/main:${ARCHIVE_DIR}/audit.json" >/dev/null
          git show "origin/main:${ARCHIVE_DIR}/mother-set.json" >/dev/null
          git show "origin/main:${ARCHIVE_DIR}/README.md" >/dev/null
          git show "origin/main:${ARCHIVE_DIR}/${SHA_NAME}" >/dev/null
          git show "origin/main:${ARCHIVE_DIR}/release-result.json" >/dev/null
          test "$(git show origin/main:${ARCHIVE_DIR}/${SHA_NAME} | awk '{print $1}')" = "${EXPECTED_ZIP_SHA256}"
          echo 'PERMANENT_ARCHIVE_PASS=true'
