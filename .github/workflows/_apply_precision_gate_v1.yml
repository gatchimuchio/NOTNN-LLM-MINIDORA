name: MINIDORA precision gate v1 apply

on:
  push:
    paths:
      - '.github/workflows/_apply_precision_gate_v1.yml'
      - 'tools/.precision_gate_payload/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: payload断片監査
        shell: bash
        run: |
          echo '1de709e1ddc097495809e145a293cd1adb4eacd478de62c21f40dde3d4bb8846  tools/.precision_gate_payload/b64_00' | sha256sum -c -
          echo '12b10c5a56f8dfb60e515dc7b09f8dd632194413b66a0f86e62ffbac9d6e43c7  tools/.precision_gate_payload/b64_01' | sha256sum -c -
          echo '540e3cb16944c01f12e82845be73196671e5fd6b15b4c7b832c6f6005f4d9b2a  tools/.precision_gate_payload/b64_02a' | sha256sum -c -
          echo '4bcc3b4a15fa5501b9a0380b28600ff0f8bc9a2bfe8245e55e45a24408875a58  tools/.precision_gate_payload/b64_02b' | sha256sum -c -
          echo 'bdeb03485d0b1cc64e888f2bc73e810f63eca247ac28eb4eedc9014083d48c82  tools/.precision_gate_payload/b64_03' | sha256sum -c -
          echo '18083f3e596ebb7eb89ca6b1a9906753d7f62a29e5a4e5927d448b62c814d250  tools/.precision_gate_payload/b64_04' | sha256sum -c -
      - name: 適用script復元・検証・実行
        shell: bash
        run: |
          cat tools/.precision_gate_payload/b64_00 tools/.precision_gate_payload/b64_01 tools/.precision_gate_payload/b64_02a tools/.precision_gate_payload/b64_02b tools/.precision_gate_payload/b64_03 tools/.precision_gate_payload/b64_04 | base64 -d > /tmp/apply_precision_gate_v1.py
          echo 'd92117140b1c2ada4334e5101903b9c6c4638b49e8e88d07c61f218ca04cd350  /tmp/apply_precision_gate_v1.py' | sha256sum -c -
          python /tmp/apply_precision_gate_v1.py
          rm -rf tools/.precision_gate_payload
          rm -f .github/workflows/_apply_precision_gate_v1.yml
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: リポジトリ整合性監査
        run: python tools/repository_consistency_check.py
      - name: 日本語基底監査
        run: python tools/日本語基底監査.py
      - name: 構文確認
        run: python -m compileall -q src tests tools
      - name: 全単体試験
        run: python -m unittest discover -s tests -v
      - name: 規模測定回帰
        run: python tools/規模測定.py
      - name: module CLI smoke
        run: python -m minidora '2+3'
      - name: console CLI smoke
        run: minidora '2+3'
      - name: main還元
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: 参照証拠閉包Gateを統合'
          git push origin HEAD:main
