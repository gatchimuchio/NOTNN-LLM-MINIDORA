name: Apply MINIDORA minimal generic core

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply_minimal_core.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode and check patch
        shell: bash
        run: |
          base64 -d .maintenance/minimal_generic_core.patch.gz.b64 | gzip -d > /tmp/minimal_generic_core.patch
          git apply --check /tmp/minimal_generic_core.patch
      - name: Apply minimal generic core
        shell: bash
        run: git apply /tmp/minimal_generic_core.patch
      - name: Install package
        run: python -m pip install -e .
      - name: Repository consistency
        run: python tools/repository_consistency_check.py
      - name: Japanese base audit
        run: python tools/日本語基底監査.py
      - name: Compile all
        run: python -m compileall -q src tests tools
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke
        run: python -m minidora "2+3"
      - name: Prepare benchmark trigger and remove maintenance files
        shell: bash
        run: |
          mkdir -p .benchmark
          printf '%s\n' 'MINIDORA minimal generic core GPQA request' 'specialist modules: disabled' 'legacy K3 helper: disabled' 'formal generic capability core: enabled' > .benchmark/GPQA_REQUEST.txt
          git rm .maintenance/minimal_generic_core.patch.gz.b64 .github/workflows/apply_minimal_core.yml
      - name: Commit validated result to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MINIDORAを最小汎用LLM核へ還元"
          git push origin HEAD:main
