name: GLM Weight D4 Full Payload Audit

on:
  workflow_dispatch:
  push:
    paths:
      - "監査/GLM_D4_TRIGGER"

concurrency:
  group: glm-weight-d4-full-payload-audit
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Cancel older GLM D4 runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/actions/workflows/glm_weight_d4_audit.yml/runs?per_page=100" \
            --jq ".workflow_runs[] | select((.status == \"queued\" or .status == \"in_progress\") and (.id != ${current})) | .id" \
            | while read -r id; do
                [ -z "$id" ] || gh api --method POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || true
              done
      - uses: actions/checkout@v4
      - name: Fix public revisions and COMPLETE shard manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p glm_audit/manifests
          python tools/glm_weight_manifest_discover.py --repo zai-org/GLM-5.3 --mirror-repo ZhipuAI/GLM-5.3 --slug glm53 --out glm_audit/manifests/glm53.json
          python tools/glm_weight_manifest_discover.py --repo zai-org/GLM-5.3-BF16 --mirror-repo ZhipuAI/GLM-5.3-BF16 --slug glm53_bf16 --out glm_audit/manifests/glm53_bf16.json
          python tools/glm_weight_manifest_discover.py --repo zai-org/GLM-5.3-Flash --mirror-repo ZhipuAI/GLM-5.3-Flash --slug glm53_flash --out glm_audit/manifests/glm53_flash.json
          python tools/glm_weight_manifest_discover.py --repo zai-org/GLM-5.3-Flash-BF16 --mirror-repo ZhipuAI/GLM-5.3-Flash-BF16 --slug glm53_flash_bf16 --out glm_audit/manifests/glm53_flash_bf16.json
          python tools/glm_weight_manifest_discover.py --repo zai-org/GLM-5.2 --mirror-repo ZhipuAI/GLM-5.2 --slug glm52 --out glm_audit/manifests/glm52.json
          python tools/glm_weight_manifest_discover.py --repo zai-org/GLM-5.2-FP8 --mirror-repo ZhipuAI/GLM-5.2-FP8 --slug glm52_fp8 --out glm_audit/manifests/glm52_fp8.json
      - name: Build <= 220 batch matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY'
          import json, math, os, pathlib
          shards=[]
          for p in sorted(pathlib.Path('glm_audit/manifests').glob('*.json')):
              m=json.loads(p.read_text())
              shards.extend(m['shards'])
          batch_size=max(1, math.ceil(len(shards)/220))
          batches=[]
          for i in range(0, len(shards), batch_size):
              batches.append({'id':f'{len(batches)+1:04d}','shards':shards[i:i+batch_size]})
          matrix={'batch':batches}
          pathlib.Path('glm_audit/batches.json').write_text(json.dumps({'total_shards':len(shards),'batch_size':batch_size,'matrix':matrix},indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
          print(f'total_shards={len(shards)} batch_size={batch_size} batches={len(batches)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: glm-d4-manifests
          path: glm_audit/
          retention-days: 30

  audit:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 100
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Stream every payload byte and verify shard
        env:
          BATCH_JSON: ${{ toJSON(matrix.batch.shards) }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          specs=json.loads(os.environ['BATCH_JSON'])
          pathlib.Path('glm_audit/results').mkdir(parents=True,exist_ok=True)
          failures=[]
          for spec in specs:
              env=os.environ.copy()
              env['SHARD_SPEC']=json.dumps(spec,separators=(',',':'))
              rc=subprocess.run([sys.executable,'tools/glm_weight_stream_audit.py','audit-shard','--out-dir','glm_audit/results'],env=env).returncode
              if rc:
                  failures.append({'repo':spec['repo'],'path':spec['path'],'returncode':rc})
          pathlib.Path('glm_audit/batch_status.json').write_text(json.dumps({'failures':failures},indent=2))
          if failures:
              raise SystemExit(1)
          PY
      - name: Upload batch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glm-payload-${{ matrix.batch.id }}
          path: glm_audit/
          retention-days: 30

  aggregate:
    if: always()
    needs: [discover, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: glm-d4-manifests
          path: glm_audit/manifests_bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: glm-payload-*
          path: glm_audit/payloads
          merge-multiple: true
      - name: Aggregate and require complete D4 coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p glm_audit/final glm_audit/all_results
          find glm_audit/payloads -type f -path '*/results/*.json' -exec cp {} glm_audit/all_results/ \;
          python tools/glm_weight_stream_audit.py aggregate \
            --manifest-dir glm_audit/manifests_bundle/manifests \
            --result-dir glm_audit/all_results \
            --output glm_audit/final/GLM_D4_FULL_PAYLOAD_AUDIT.json
      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [ -f glm_audit/final/GLM_D4_FULL_PAYLOAD_AUDIT.json ]; then
            echo '## GLM D4 Full Payload Audit' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat glm_audit/final/GLM_D4_FULL_PAYLOAD_AUDIT.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GLM-D4-FULL-PAYLOAD-AUDIT
          path: glm_audit/final/
          retention-days: 90
