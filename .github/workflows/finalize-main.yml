name: main最終化

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-main.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 既知の整合性修正
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('product/src/minidora/cli.py')
          text = path.read_text(encoding='utf-8')
          if 'from dataclasses import asdict' not in text:
              text = text.replace('import argparse\n', 'import argparse\nfrom dataclasses import asdict\n', 1)
          text = text.replace('[source.__dict__ for source in result.sources]', '[asdict(source) for source in result.sources]')
          path.write_text(text, encoding='utf-8')
          PY
      - name: 製品依存を導入
        working-directory: product
        run: python -m pip install -e '.[dev]'
      - name: 単体・統合試験
        working-directory: product
        run: pytest
      - name: 製品自己監査
        working-directory: product
        run: python scripts/verify_product.py
      - name: K3差分ベンチ再実行
        working-directory: product
        run: python benchmarks/run_benchmark.py --output benchmark_results/latest-main --repetitions 300
      - name: 修正と最新ベンチをmainへ確定
        run: |
          git config user.name 'MINIDORA Main Gate'
          git config user.email 'actions@users.noreply.github.com'
          git add product/src/minidora/cli.py product/benchmark_results/latest-main/benchmark.json
          if git diff --cached --quiet; then
            echo '変更なし'
          else
            git commit -m 'main最終検証とK3差分ベンチ更新 [skip ci]'
            git push origin main
          fi
