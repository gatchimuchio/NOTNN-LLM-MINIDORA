name: TEMP HDS intervention terminology audit

on:
  push:
    branches:
      - sandbox/hds-intervention-rename-20260907
    paths:
      - '.github/workflows/temp_hds_intervention_term_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HDS介入用語全数監査
        shell: bash
        run: |
          set -o pipefail
          grep -RInE --exclude-dir=.git --exclude='*.json' --exclude='*.zip' \
            '安全弁|safety valve|SAFETY_VALVE|HDS_FEEDBACK_SAFETY_VALVE' . \
            | tee hds_intervention_terms.txt || true
          echo "COUNT=$(wc -l < hds_intervention_terms.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: hds-intervention-term-audit
          path: hds_intervention_terms.txt
          if-no-files-found: error
