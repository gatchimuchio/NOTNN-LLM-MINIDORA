name: HDS Compiler R境界 受入一時実行

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/HDS_Compiler_R境界_受入一時.yml"

permissions:
  contents: read

concurrency:
  group: hds-compiler-r-boundary-acceptance-once
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: 構文確認
        run: python -m compileall -q src tests
      - name: Compiler-R-Core境界回帰
        run: |
          python tests/test_HDS_参照観測要求.py
          python tests/test_HDS_構文化器_処理系列_v1_3.py
          python tests/test_HDS参照.py
          python tests/test_HDS_参照_代替経路.py
          python tests/test_HDS_参照_予算.py
          python tests/test_HDS_参照_並列.py
          python tests/test_HDSコア入力優先_v1.py
          python tests/test_言語_意味_橋渡し.py
          python tests/test_実行系射影_v15.py
          python tests/test_一般_関係_整理_v11.py
          python tests/test_英語質問表示境界.py
