name: MINIDORA30 state-delta direct A-B

on:
  push:
    branches: [bench/minidora30-plus-chappie4-state-delta-20260916]
    paths:
      - .github/workflows/bench_minidora30_state_delta_direct_ab_20260916.yml

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { id: '000_024', start: 0,   limit: 25 }
          - { id: '025_049', start: 25,  limit: 25 }
          - { id: '050_074', start: 50,  limit: 25 }
          - { id: '075_099', start: 75,  limit: 25 }
          - { id: '100_124', start: 100, limit: 25 }
          - { id: '125_149', start: 125, limit: 25 }
          - { id: '150_174', start: 150, limit: 25 }
          - { id: '175_197', start: 175, limit: 23 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: 同一IR・同一Rで旧30核と更新核を直接A/B
        run: >-
          python tools/bench_minidora30_state_delta_direct_ab.py
          --start-index ${{ matrix.start }} --limit ${{ matrix.limit }}
          --out direct_ab_${{ matrix.id }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: direct-ab-${{ matrix.id }}
          path: direct_ab_${{ matrix.id }}.json
          if-no-files-found: error

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: direct-ab-*
          path: shards
          merge-multiple: true
      - name: 198問直接A/B集計
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('shards').glob('direct_ab_*.json'))
          rows=[]; protocols=[]
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8')); protocols.append(d['protocol']); rows.extend(d['details'])
          rows=sorted(rows,key=lambda x:int(x['index']))
          assert len(rows)==198 and [int(x['index']) for x in rows]==list(range(198))
          assert {p['dataset_csv_sha256'] for p in protocols}=={'41d1213cd7a4998605a26c2798500652572007161b3a92817ba46b35befcd305'}
          assert all(p['same_question_ir'] and p['same_reference_records'] and p['same_reference_identity'] for p in protocols)
          old_correct=sum(bool(x['old']['correct']) for x in rows)
          new_correct=sum(bool(x['new']['correct']) for x in rows)
          old_answered=sum(bool(x['old']['answered']) for x in rows)
          new_answered=sum(bool(x['new']['answered']) for x in rows)
          changed=sum(x['old']['predicted']!=x['new']['predicted'] for x in rows)
          improved=sum(x['new']['correct'] and not x['old']['correct'] for x in rows)
          regressed=sum(x['old']['correct'] and not x['new']['correct'] for x in rows)
          summary={
            'schema':'minidora.gpqa.state-delta-direct-ab.full198.v1',
            'total':198,
            'protocol':protocols[0],
            'old_minidora30_core':{'correct':old_correct,'accuracy_percent':100*old_correct/198,'answered':old_answered,'suspended':198-old_answered},
            'new_state_delta_core':{'correct':new_correct,'accuracy_percent':100*new_correct/198,'answered':new_answered,'suspended':198-new_answered},
            'delta':{'correct_delta':new_correct-old_correct,'accuracy_points':100*(new_correct-old_correct)/198,'answered_delta':new_answered-old_answered,'changed_answers':changed,'improved_cases':improved,'regressed_cases':regressed,'net_improved_cases':improved-regressed},
            'details':rows,
          }
          Path('direct_ab_full198_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in summary.items() if k!='details'},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: direct-ab-full198-summary
          path: direct_ab_full198_summary.json
          if-no-files-found: error
