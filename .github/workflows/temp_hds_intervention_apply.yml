name: TEMP HDS intervention terminology apply

on:
  push:
    branches:
      - sandbox/hds-intervention-rename-20260907
    paths:
      - '.github/workflows/temp_hds_intervention_apply.yml'
      - 'tools/temp_apply_hds_intervention_terminology.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: HDS監督介入用語を適用
        run: python tools/temp_apply_hds_intervention_terminology.py
      - name: 現行実装から旧総称を排除
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '安全弁|safety valve|SAFETY_VALVE|HDS_FEEDBACK_SAFETY_VALVE' \
            src/minidora/runtime.py \
            src/minidora/hds_model_projection.py \
            src/minidora/hds監督選択runtime.py \
            tools/benchmark_formal.py \
            tools/benchmark_formal_scientific_ab.py; then
            echo 'legacy umbrella terminology remains in active runtime/tooling' >&2
            exit 1
          fi
          test "$(grep -c '従来の「HDS安全弁」' 設計/32_MINIDORA_HDS監督介入制御_v1.md)" -eq 1
      - name: 構文確認
        run: python -m compileall -q src tests tools
      - name: HDS監督介入 targeted tests
        run: |
          python -m unittest tests.test_hds監督選択runtime -v
          python -m unittest tests.test_runtime_hds_choice -v
          python -m unittest tests.test_hds監督architecture -v
      - name: 全単体試験
        run: python -m unittest discover -s tests -v
      - name: sandboxへ確定差分をcommit
        shell: bash
        run: |
          git config user.name 'gatchimuchio'
          git config user.email 'ohira.teppei@gmail.com'
          git add \
            src/minidora/runtime.py \
            src/minidora/hds_model_projection.py \
            src/minidora/hds監督選択runtime.py \
            tools/benchmark_formal.py \
            tools/benchmark_formal_scientific_ab.py \
            tests/test_hds監督選択runtime.py \
            tests/test_runtime_hds_choice.py \
            tests/test_hds監督architecture.py \
            設計/32_MINIDORA_HDS監督介入制御_v1.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: HDS安全弁総称をHDS監督介入へ統合'
          git push origin HEAD:sandbox/hds-intervention-rename-20260907
