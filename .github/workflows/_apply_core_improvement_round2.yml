name: MINIDORA core improvement round2 apply

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: payload再構成
        shell: bash
        run: |
          cat tools/.core2_payload/part* > /tmp/apply_core2.py
          echo '472fdddc1aedb2fd47636516b06a06f90b6e089b81fb694902e93dd738927f06  /tmp/apply_core2.py' | sha256sum -c -
      - name: 改善差分適用
        run: python /tmp/apply_core2.py
      - name: 一時適用物除去
        shell: bash
        run: |
          rm -rf tools/.core2_payload
          rm -f .github/workflows/_apply_core_improvement_round2.yml
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: リポジトリ整合性監査
        run: python tools/repository_consistency_check.py
      - name: 日本語基底監査
        run: python tools/日本語基底監査.py
      - name: 構文確認
        run: python -m compileall -q src tests tools
      - name: 単体試験
        run: python -m unittest discover -s tests -v
      - name: legacy規模測定回帰
        run: python tools/規模測定.py
      - name: module CLI smoke
        run: python -m minidora "2+3"
      - name: console CLI smoke
        run: minidora "2+3"
      - name: main還元
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "feat: 最小汎用core改善2を統合"
          git push origin HEAD:main
