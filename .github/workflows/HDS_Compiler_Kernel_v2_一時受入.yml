name: HDS Compiler Kernel v2 一時受入

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/HDS_Compiler_Kernel_v2_一時受入.yml"

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: 構文
        run: python -m compileall -q src tests
      - name: R観測要求診断
        run: |
          python - <<'PY'
          from minidora.HDS構文化器 import 公開HDSコンパイラ
          from minidora.HDS参照 import HDS参照問合せ候補
          from minidora.HDS観測計画 import HDS参照観測要求群
          c=公開HDSコンパイラ()
          ir=c.問題IR("Which protein inhibits kinase X?", ("Protein A","Protein B","Protein C","Protein D"))
          print("QUERIES", HDS参照問合せ候補(ir))
          for r in HDS参照観測要求群(ir):
              print("REQ", r.ID, r.関係ID, r.関係種別, r.候補ラベル, r.段階, r.優先度, repr(r.外部検索表層))
          ir2=c.問題IR("Which molecule causes apoptosis under hypoxia?", ("Protein A","Protein B","Protein C","Protein D"))
          print("APOPTOSIS_QUERIES", HDS参照問合せ候補(ir2))
          for rel in ir2.関係:
              print("APOPTOSIS_REL", rel.関係ID, rel.種別, rel.始点, rel.終点, rel.条件)
          for r in HDS参照観測要求群(ir2):
              print("APOPTOSIS_REQ", r.ID, r.関係ID, r.関係種別, r.候補ラベル, r.段階, r.優先度, repr(r.外部検索表層))
          PY
      - name: Kernelと既存資産の回帰
        run: |
          python -m unittest -v \
            tests.test_HDS_構文化器_処理系列_v1_3 \
            tests.test_HDSコア入力優先_v1 \
            tests.test_HDS_参照観測要求 \
            tests.test_HDS参照 \
            tests.test_HDS_参照_代替経路 \
            tests.test_HDS_参照_予算 \
            tests.test_HDS_参照_並列 \
            tests.test_HDS_参照_優先度 \
            tests.test_HDS能力経路_v2 \
            tests.test_HDS正本継承循環_v1 \
            tests.test_HDS監督選択実行系 \
            tests.test_実行系_HDS_v1 \
            tests.test_実行系射影_v15 \
            tests.test_実行系参照射影_v15 \
            tests.test_HDS_構文化器 \
            tests.test_HDS_未知_欄 \
            tests.test_HDS_構文化器_構造_v1 \
            tests.test_HDS_構文化器_構造_v1_1 \
            tests.test_HDS構文化構造_v1 \
            tests.test_HDS構文化構造_v1_2 \
            tests.test_HDS_言語_関係 \
            tests.test_HDS_言語_範囲 \
            tests.test_言語_意味_橋渡し \
            tests.test_一般_関係_整理_v11 \
            tests.test_連言_協調_整理_v09 \
            tests.test_極性保持_v17 \
            tests.test_関係修飾_v18 \
            tests.test_射影連鎖忠実度_v1 \
            tests.test_英語質問表示境界 \
            tests.test_局所解釈連続性 \
            tests.test_要求解釈_HDS \
            tests.test_会話意味統合 \
            tests.test_目的会話 \
            tests.test_命題会話 \
            tests.test_集合会話 \
            tests.test_HDS自律接続_v3

# rerun after sideband and relation dedupe

# rerun after kernel contract test migration

# rerun after canonical relation and audit fallback fixes

# rerun after semantic canonical relation dominance
