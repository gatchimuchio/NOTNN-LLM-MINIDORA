name: HDS Compiler Kernel v2 一時受入

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/HDS_Compiler_Kernel_v2_一時受入.yml"

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: 構文
        run: python -m compileall -q src tests
      - name: Kernel境界局所回帰
        run: |
          python -m unittest -v             tests.test_HDS_構文化器_処理系列_v1_3             tests.test_HDSコア入力優先_v1             tests.test_HDS_参照観測要求             tests.test_HDS正本継承循環_v1             tests.test_実行系_HDS_v1             tests.test_実行系射影_v15             tests.test_実行系参照射影_v15             tests.test_HDS能力経路_v2             tests.test_HDS参照             tests.test_HDS_参照_代替経路             tests.test_言語_意味_橋渡し             tests.test_一般_関係_整理_v11
      - name: 全単体試験
        run: python -m unittest discover -s tests -p "test_*.py"

# rerun after observation-plan repair

# rerun 1970-01-01T00:00:00.000Z kernel-fix-2

# rerun kernel-fix-3
