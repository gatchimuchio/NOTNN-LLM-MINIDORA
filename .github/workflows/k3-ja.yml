name: K3日本語命令化版CI

on:
  push:
    branches: [main]
    paths:
      - '研究/K3命令化非ニューラル実装_v0.3.1_日本語版/**'
      - '.github/workflows/k3-ja.yml'
  pull_request:
    paths:
      - '研究/K3命令化非ニューラル実装_v0.3.1_日本語版/**'
      - '.github/workflows/k3-ja.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k3-ja-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 研究/K3命令化非ニューラル実装_v0.3.1_日本語版
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 研究/K3命令化非ニューラル実装_v0.3.1_日本語版/pyproject.toml
      - name: 試験依存を導入
        run: python -m pip install -e . pytest
      - name: 日本語命令化版を再検証
        run: python 操作/配布を検証.py

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 研究/K3命令化非ニューラル実装_v0.3.1_日本語版
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 研究/K3命令化非ニューラル実装_v0.3.1_日本語版/pyproject.toml
      - name: 試験依存を導入
        run: python -m pip install -e . pytest
      - name: Windowsで日本語識別子・pathを検証
        run: python 操作/配布を検証.py
