name: package-llama3-self-v2-once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-llama3-self-v2-once.yml
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify and package Llama3 self-consistency artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile

          src = Path('構文化/Llama3_自己一貫性_HDS再構文化_v2')
          manifest_path = src / 'MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          for item in manifest['files']:
              p = src / item['path']
              b = p.read_bytes()
              assert len(b) == item['bytes'], (str(p), len(b), item['bytes'])
              assert hashlib.sha256(b).hexdigest() == item['sha256'], str(p)

          out = Path('構文化/正本パッケージ/Llama3_自己一貫性_HDS再構文化_v2_repo.zip')
          out.parent.mkdir(parents=True, exist_ok=True)
          root_name = src.name
          files = sorted(p for p in src.iterdir() if p.is_file())
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in files:
                  info = zipfile.ZipInfo(f'{root_name}/{p.name}', date_time=(2026, 8, 21, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, p.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)

          data = out.read_bytes()
          sha256 = hashlib.sha256(data).hexdigest()
          sidecar = out.with_suffix(out.suffix + '.sha256')
          sidecar.write_text(f'{sha256}  {out.name}\n', encoding='utf-8')

          validation_path = Path('構文化/正本パッケージ/IMPORT_VALIDATION.json')
          validation = json.loads(validation_path.read_text(encoding='utf-8'))
          validation['validation'] = 'canonical packages verified; repository packages are content-verified against their manifests before packaging'
          validation['packages'][out.name] = {
              'bytes': len(data),
              'sha256': sha256,
              'git_blob_sha1': None,
              'source_manifest': '構文化/Llama3_自己一貫性_HDS再構文化_v2/MANIFEST.json',
              'package_kind': 'deterministic repository package'
          }
          validation_path.write_text(json.dumps(validation, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'package bytes={len(data)} sha256={sha256}')
          PY

          blob_sha=$(git hash-object '構文化/正本パッケージ/Llama3_自己一貫性_HDS再構文化_v2_repo.zip')
          python - "$blob_sha" <<'PY'
          from pathlib import Path
          import json, sys
          p = Path('構文化/正本パッケージ/IMPORT_VALIDATION.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d['packages']['Llama3_自己一貫性_HDS再構文化_v2_repo.zip']['git_blob_sha1'] = sys.argv[1]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text(encoding='utf-8')
          marker = '- Llama 3 HDS 日本語構文\n'
          addition = '- Llama 3 自己一貫性 HDS再構文化 v2（repo固定パッケージ）\n'
          if addition not in s:
              if marker in s:
                  s = s.replace(marker, marker + addition, 1)
              else:
                  s += '\n' + addition
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit package and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'minidora-artifact-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            '構文化/正本パッケージ/Llama3_自己一貫性_HDS再構文化_v2_repo.zip' \
            '構文化/正本パッケージ/Llama3_自己一貫性_HDS再構文化_v2_repo.zip.sha256' \
            '構文化/正本パッケージ/IMPORT_VALIDATION.json' \
            README.md
          git rm -- .github/workflows/package-llama3-self-v2-once.yml
          git commit -m 'Llama3自己一貫性HDS再構文化v2を正本パッケージ化'
          git push origin main
