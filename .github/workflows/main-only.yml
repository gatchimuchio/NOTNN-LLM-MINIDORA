name: main一本化

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-only
  cancel-in-progress: false

jobs:
  delete-non-main-branches:
    runs-on: ubuntu-latest
    steps:
      - name: main以外のbranch refを削除
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "MINIDORA-main-only-gate",
          }

          branches = []
          page = 1
          while True:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/branches?per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  rows = json.load(response)
              if not rows:
                  break
              branches.extend(row["name"] for row in rows)
              if len(rows) < 100:
                  break
              page += 1

          failures = []
          deleted = []
          for branch in branches:
              if branch == "main":
                  continue
              encoded = urllib.parse.quote(branch, safe="")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/refs/heads/{encoded}",
                  method="DELETE",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 204:
                          failures.append({"branch": branch, "status": response.status})
                      else:
                          deleted.append(branch)
              except Exception as exc:
                  failures.append({"branch": branch, "error": repr(exc)})

          print(json.dumps({"deleted": deleted, "failures": failures}, ensure_ascii=False, indent=2))
          if failures:
              raise SystemExit(1)
          PY
