name: 一時 正本系統文書同期

on:
  push:
    branches:
      - docs/canonical-lineages-20260917
    paths:
      - .github/workflows/_tmp_正本系統同期.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/canonical-lineages-20260917
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 文書表現を系統別正本へ同期
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'置換対象が見つからない: {path}: {old[:80]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # AGENTS: 正本系統を明示し、HDSをMINIDORA30の置換扱いしない。
          replace_once(
              'AGENTS.md',
              '## 4. HDS-first 内部実行正本\n\n現行内部開発正本は `設計/60_MINIDORA_HDS自律接続_v3.md`。設計58・59は成立経緯と下位契約を保持し、変更点には設計60を適用する。',
              '## 4. 正本系統とHDS-MINIDORA系\n\n正本系統の最上位案内は `正本系統.md`。MINIDORA30系、MINIDORA80系、HDS-MINIDORA系は同一系列の新旧版ではなく、別系統の正本として並立保持する。\n\nHDS-MINIDORA系の現行実装正本は `HDS_MINIDORA_現行正本.md` と `設計/60_MINIDORA_HDS自律接続_v3.md`。設計58・59は成立経緯と下位契約、設計61・62は原子的更新と非退行境界を保持する。'
          )
          replace_once(
              'AGENTS.md',
              '現行GPQA正本セーブポイントは `MINIDORA30 / 30/198`。詳細は `現行正本.md` と `docs/SAVEPOINT_2026-09-09_MINIDORA30.md` を参照する。\n\nHDS-firstを新しい模型核正本へ置換する場合は、上記GPQA契約に従うLIVE_ONLY 198/198全数測定と同一run controlled A/Bを別途実施し、既存正本値を履歴として保持する。',
              'MINIDORA30系の現行GPQA性能正本セーブポイントは `MINIDORA30 / 30/198`。MINIDORA80系は能力モジュール込みシステム正本、HDS-MINIDORA系は別系統の実行主体正本として扱う。詳細は `正本系統.md`、`現行正本.md`、`HDS_MINIDORA_現行正本.md` を参照する。\n\nHDS-MINIDORA系の性能数値を正本化する場合は、MINIDORA30系の値を置換せず、HDS-MINIDORA系としてLIVE_ONLY 198/198全数測定と成果物を別途保存する。'
          )

          # 設計README
          replace_once(
              '設計/README.md',
              '## 現行内部実装正本 — 2026-09-17 HDS-first\n\n外向きのMINIDORA定義は変更しない。',
              '## HDS-MINIDORA系現行実装正本 — 2026-09-17\n\nHDS-MINIDORAはMINIDORA30/80の後継・置換ではなく、HDSを実行主体とする別系統の正本である。正本系統の全体規定は `../正本系統.md`、HDS-MINIDORA系正本は `../HDS_MINIDORA_現行正本.md` を参照する。\n\n外向きのMINIDORA定義は変更しない。'
          )
          replace_once(
              '設計/README.md',
              '局所正本: [`58_MINIDORA_HDS実行主体_v1.md`](58_MINIDORA_HDS実行主体_v1.md)',
              'HDS-MINIDORA系局所正本: [`60_MINIDORA_HDS自律接続_v3.md`](60_MINIDORA_HDS自律接続_v3.md)（設計58・59を成立履歴、61・62を非退行境界として併読）'
          )
          replace_once(
              '設計/README.md',
              '旧HDS監督値をHDS-first新コアの性能値へ読み替えない。新コアの性能正本置換は、既存GPQA正本契約に従う別の全数測定を必要とする。',
              '旧HDS監督値をHDS-MINIDORA系の性能値へ読み替えない。HDS-MINIDORA系の性能数値を正本化する場合は、MINIDORA30/80系を置換せず、HDS-MINIDORA系として別の全数測定を保存する。'
          )

          # 評価README
          replace_once(
              '評価/README.md',
              '## 現行正本 — MINIDORA30 / 2026-09-09',
              '## 正本系統\n\n評価正本も系統別に保持する。\n\n- MINIDORA30系: 模型核GPQA性能正本\n- MINIDORA80系: 能力モジュール込みシステムGPQA性能正本\n- HDS-MINIDORA系: `HDS_MINIDORA_受入正本_2026-09-17.md`\n\n一方の系統の評価結果で他方を旧版化・置換しない。全体規定は `../正本系統.md` を参照する。\n\n## MINIDORA30系現行性能正本 — MINIDORA30 / 2026-09-09'
          )
          replace_once(
              '評価/README.md',
              '## 現行能力モジュール込みシステム正本 — MINIDORA80 / 2026-09-09',
              '## MINIDORA80系現行性能正本 — MINIDORA80 / 2026-09-09'
          )
          replace_once(
              '評価/README.md',
              '## 主要成立証拠 — モジュール拡張可能性',
              '## HDS-MINIDORA系受入正本 — 2026-09-17\n\nHDS-MINIDORA系は別系統の正本として `HDS_MINIDORA_受入正本_2026-09-17.md` を保持する。MINIDORA30系の30/198、MINIDORA80系の80/198をHDS-MINIDORA固有性能へ転記しない。\n\nRMW修正後同runではMINIDORA30互換25/198、並列HDS-v3 24/198を観測し、その後の非退行包絡受入再生で25/198・差0を確認した。この25/198はHDS-MINIDORA固有の新GPQA性能正本ではなく、性能下限契約の受入証拠である。\n\n## 主要成立証拠 — モジュール拡張可能性'
          )
          replace_once(
              '評価/README.md',
              'この値は当時の汎用core現在地として履歴保持する。現行正本はMINIDORA30である。',
              'この値は当時の汎用core現在地として履歴保持する。MINIDORA30系の現行性能正本はMINIDORA30である。'
          )

          # src README
          replace_once(
              'src/README.md',
              '## 内部実行正本 — HDS-first core\n\n2026-09-17以後、内部開発上の制御主語はHDSとする。',
              '## HDS-MINIDORA系実行正本 — HDS-first core\n\nHDS-MINIDORAはMINIDORA30/80とは別系統の正本である。正本は `../HDS_MINIDORA_現行正本.md` を参照する。\n\n2026-09-17以後、HDS-MINIDORA系の制御主語はHDSとする。'
          )
          replace_once(
              'src/README.md',
              '外向きのLLM成立契約、厳密言語模型核、MINIDORA30 / MINIDORA80の既存正本値はこの変更で置換しない。',
              '外向きのLLM成立契約、厳密言語模型核、MINIDORA30系 / MINIDORA80系の既存正本値はHDS-MINIDORA系によって置換しない。'
          )

          # tools README
          replace_once(
              'tools/README.md',
              '## 現行セーブポイント\n\n現行正本は [`../docs/SAVEPOINT_2026-09-09_MINIDORA30.md`](../docs/SAVEPOINT_2026-09-09_MINIDORA30.md)。',
              '## MINIDORA30系現行性能セーブポイント\n\nMINIDORA30系の現行性能正本は [`../docs/SAVEPOINT_2026-09-09_MINIDORA30.md`](../docs/SAVEPOINT_2026-09-09_MINIDORA30.md)。HDS-MINIDORA系は別系統であり、`../HDS_MINIDORA_現行正本.md` と `../評価/HDS_MINIDORA_受入正本_2026-09-17.md` を参照する。'
          )
          PY
      - name: 差分確認
        run: git diff --check && git diff -- AGENTS.md 設計/README.md 評価/README.md src/README.md tools/README.md
      - name: commit
        shell: bash
        run: |
          git config user.name 'がっちむち♂'
          git config user.email 'ohira.teppei@gmail.com'
          git add AGENTS.md 設計/README.md 評価/README.md src/README.md tools/README.md
          git commit -m 'docs: 正本参照を系統別へ同期'
          git push origin HEAD:docs/canonical-lineages-20260917
