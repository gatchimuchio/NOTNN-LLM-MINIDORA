name: MINIDORA 再構築CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: パッケージ導入
        run: python -m pip install -e .
      - name: リポジトリ整合性監査
        run: python tools/リポジトリ整合性監査.py
      - name: 日本語基底監査
        run: |
          python tools/日本語基底監査.py
          python tools/日本語基底詳細監査.py
      - name: 構文確認
        run: python -m compileall -q src tests tools
      - name: 単体試験
        run: python -m unittest discover -s tests -v
      - name: v0.4規模測定の履歴回帰
        run: python tools/規模測定.py
      - name: モジュール起動確認
        run: python -m minidora "2+3"
      - name: コンソール起動確認
        run: minidora "2+3"
